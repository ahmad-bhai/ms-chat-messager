<!DOCTYPE html>
<html lang="en" data-t="dark">

<title>MS Chat</title>

[hidden]{display:none!important}
.i{width:22px;height:22px;fill:currentColor;flex:none}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);z-index:5}
#cv{z-index:6}#pg{z-index:7}

.m{max-width:84%;padding:6px 10px;border-radius:16px;margin:2px 10px;font-size:var(--fs);word-break:break-word;border:1px solid var(--bd);user-select:text}

.mt{display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-top:2px}.mt .i{width:14px;height:14px}
.em{width:1.3em;height:1.3em;vertical-align:-.3em}.big{width:96px;height:96px;animation:bn 2s ease-in-out infinite}

.md{max-width:100%;max-height:300px;border-radius:12px;display:block}
.rp{border-left:3px solid #C54FDA;padding-left:6px;margin-bottom:4px;font-size:13px;opacity:.9}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}.rx span{background:var(--bd);border-radius:99px;padding:1px 7px;font-size:12px;cursor:pointer}
.ul{color:#8fd0ff;cursor:pointer}
.cmp{display:flex;gap:6px;align-items:flex-end;padding:8px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.bx{width:100%;max-width:360px;padding:18px;background:var(--bg)}.bx h3{margin-bottom:8px}.bx p{opacity:.8;margin-bottom:8px}

.cb{display:flex;gap:8px;align-items:center;margin:8px 0}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;padding:8px;background:var(--bg)}
.it{display:flex;gap:14px;align-items:center;padding:12px}.it.red{color:#ff6b6b}
.rr{display:flex;justify-content:space-around;padding:6px}.rr img{width:34px}
.dw{width:82%;max-width:330px;height:100%;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top)}
hr{border:0;border-top:1px solid var(--bd);margin:6px 0}
.sec{margin:10px 0;padding:4px}
.wps{display:flex;gap:8px;flex-wrap:wrap;padding:8px}.wps div{width:56px;height:80px;border-radius:12px;border:2px solid var(--bd)}
</style>
</head>

let st1;function lsearch(v){clearTimeout(st1);st1=setTimeout(async()=>{if(!v.trim())return cl2();const j=await api('/search?q='+E(v));$('#cl').innerHTML=(j.users||[]).map(u=>`<div class="row" data-a="ou" data-u="${esc(u.username)}">${av(u)}<div class="fx"><b>${nm(u.name)}</b><br><small>@${esc(u.username)}</small></div></div>`).join('')+(j.chats||[]).map(x=>{const c=S.ch.find(y=>y.chat===x.chat);return c?`<div class="row" data-a="open" data-c="${x.chat}">${av(c.peer,46,c.saved)}<div class="fx"><b>${nm(ct(c))}</b><div class="sn">${rich(x.snippet)}</div></div></div>`:''}).join('')||'<p style="text-align:center;padding:24px;opacity:.6">No results</p>'},300)}
const cl2=()=>{$('#cl').innerHTML=S.ch.map(row).join('')};
Act.gs=()=>{const s=$('#sb');s.hidden=!s.hidden;if(s.hidden){$('#q').value='';cl2()}else $('#q').focus()};

Act.ou=el=>openUser(el.dataset.u);
async function openUser(n){const j=await api('/user?u='+E(n));if(!ok(j))return;const o=S.ch.find(x=>x.chat===j.chat)||{mute:0};$('#pg').hidden=true;openC({...o,chat:j.chat,peer:j.user,cn:j.cn,saved:j.self,blocked:j.blocked})}
async function openById(id,mid){let c=S.ch.find(x=>x.chat===id);if(!c){await loadChats();c=S.ch.find(x=>x.chat===id)}c&&openC(c,mid?'around':0,mid)}

/* ---------- chat ---------- */
async function openC(c,mode,mid){S.cur=c;S.ms=[];S.rep=S.edit=null;MSNotify.setActiveChat(c.chat);history.replaceState(0,'',c.saved?'/':'/'+c.peer.username);$('#cv').hidden=false;drawC();await loadMs(mode,mid);api('/read',{chat:c.chat});c.unread=0}
function drawC(){const c=S.cur;$('#cv').innerHTML=`<div class="hd badge" style="border-radius:0"><button class="ib" data-a="back">${ic('back')}</button><div class="row fx" style="padding:0" data-a="prof">${av(c.peer,40,c.saved)}<div class="fx"><b class="sn">${nm(ct(c))}</b><small id="st">${c.saved?'':stat(c.peer)}</small></div></div><button class="ib" data-a="csearch">${ic('search')}</button><button class="ib" data-a="cmenu">${ic('more')}</button></div><div id="sb2" hidden style="padding:0 10px"><input id="cq" class="inp" placeholder="Search in this chat"></div><div id="pn" hidden></div><div id="ms"></div><div id="rb" hidden></div>${c.blocked?`<div style="text-align:center;padding:10px"><button class="btn" data-a="unblock">Unblock User</button><p data-a="addc" style="padding:12px;color:var(--sf)">${c.cn?'Edit contact':'Add contact'}</p></div>`:`<div class="cmp"><button class="ib" data-a="attach">${ic('clip')}</button><button class="ib" data-a="cam">${ic('cam')}</button><textarea id="inp" rows="1" placeholder="Message"></textarea><button class="tile" id="sbtn" data-a="sendmic">${ic('mic')}</button></div>`}`;
const i=$('#inp');if(i){i.oninput=()=>{$('#sbtn').innerHTML=ic(i.value.trim()?'send':'mic');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,120)+'px'};i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>700){e.preventDefault();snd()}}}
$('#cq').oninput=e=>{clearTimeout(st1);const v=e.target.value;st1=setTimeout(async()=>{if(!v.trim())return drawMs();const j=await api('/search?chat='+E(S.cur.chat)+'&q='+E(v));$('#ms').innerHTML=(j.msgs||[]).map(m=>`<div class="row" data-a="sres" data-i="${m.id}"><div class="fx"><small>${tm(m.ts)}</small><div>${rich(m.text)}</div></div></div>`).join('')||'<p style="margin:auto;opacity:.6">No results</p>'},300)}}
async function loadMs(mode,mid){const q='/msgs?chat='+E(S.cur.chat)+(mode==='first'?'&mode=first':mode==='around'?'&around='+mid:'');const j=await api(q);if(!j.msgs)return;S.ms=j.msgs;S.pin0=j.pin;S.pr=j.rd;S.sb=mode!=='first';drawMs();S.sb=0;if(mode==='first')$('#ms').scrollTop=0;if(mode==='around')Act.goto({dataset:{i:mid}})}
const tick=m=>m.id<=S.pr?`<span style="color:#6cf;display:flex">${ic('ok')}${ic('ok')}</span>`:ic('ok');
function media(m){const x=m.media;if(!x)return'';const u=esc(x.url);return x.type==='image'?`<img class="md" src="${u}" data-a="view">`:x.type==='video'?`<video class="md" controls src="${u}"></video>`:x.type==='audio'||x.type==='voice'?`<audio controls src="${u}" style="max-width:100%"></audio>`:`<a href="${u}" target="_blank" style="color:inherit;display:flex;gap:8px;align-items:center">${ic('file')}${esc(x.name||'file')}</a>`}
function mh(m){const me=m.from===S.me.id,big=!m.media&&m.text&&BIG.test(m.text.trim());const g={};Object.values(m.react||{}).forEach(e=>g[e]=(g[e]||0)+1);
return `<div class="m ${me?'me':'th'}" id="m${m.id}" data-a="mm" data-i="${m.id}">${m.fwd?`<small>Forwarded from ${nm(m.fwd)}</small><br>`:''}${m.reply?`<div class="rp" data-a="goto" data-i="${m.reply.id}"><b>${nm(m.reply.name)}</b><br>${nm((m.reply.text||'').slice(0,80))}</div>`:''}${media(m)}${big?rich(m.text).replace('class="em"','class="em big"'):`<span>${rich(m.text||'')}</span>`}<div class="mt"><small>${(m.pin||[]).includes(S.me.id)?ic('pin'):''}${m.edited?'edited ':''}${tm(m.ts)}</small>${me?tick(m):''}</div>${Object.keys(g).length?`<div class="rx">${Object.entries(g).map(([e,n])=>`<span data-a="rc" data-i="${m.id}" data-e="${e}"><img class="em" src="${eu(e)}">${n>1?n:''}</span>`).join('')}</div>`:''}</div>`}
function drawMs(){const el=$('#ms');if(!el)return;const nb=el.scrollHeight-el.scrollTop-el.clientHeight<140;el.style.background=wp();el.innerHTML=S.ms.map(mh).join('')||'<p style="margin:auto;opacity:.6">No messages yet</p>';if(nb||S.sb)el.scrollTop=el.scrollHeight;
const pl=S.ms.filter(x=>(x.pin||[]).includes(S.me.id)).pop(),p=pl||(S.pin0&&!S.ms.some(x=>x.id===S.pin0.id)?S.pin0:null);$('#pn').hidden=!p;if(p)$('#pn').innerHTML=`<div class="row badge" data-a="goto" data-i="${p.id}" style="border-radius:0">${ic('pin')}<div class="sn">${rich(p.text||'['+(p.media&&p.media.type)+']')}</div></div>`}
function merge(m){const i=S.ms.findIndex(x=>x.id===m.id);if(m.gone){if(i>=0)S.ms.splice(i,1);return}if(i>=0)S.ms[i]=m;else{S.ms.push(m);S.ms.sort((a,b)=>a.id-b.id)}}
Act.goto=el=>{const e=$('#m'+el.dataset.i);if(e){e.scrollIntoView({block:'center'});e.style.outline='2px solid #C54FDA';setTimeout(()=>e.style.outline='',1500)}else loadMs('around',el.dataset.i)};
Act.sres=el=>{$('#sb2').hidden=true;$('#cq').value='';loadMs('around',el.dataset.i)};
Act.csearch=()=>{const s=$('#sb2');s.hidden=!s.hidden;if(s.hidden){$('#cq').value='';drawMs()}else $('#cq').focus()};
Act.back=()=>{if(!S.cur)return;S.cur=null;$('#cv').hidden=true;MSNotify.setActiveChat(null);history.replaceState(0,'','/');loadChats().then(list)};
onpopstate=()=>{if(!$('#pg').hidden)Act.pback();else Act.back()};
const cid=()=>S.cur.chat,sm=()=>S.sm;
Act.mm=el=>{const m=S.ms.find(x=>x.id==el.dataset.i);if(!m)return;S.sm=m;const mine=m.from===S.me.id;sheet(`<div class="rr">${RE.map(e=>`<img data-a="react" data-e="${e}" src="${eu(e)}">`).join('')}</div>${it('reply','Reply','rep')}${m.text?it('copy','Copy','cp'):''}${it('fwd','Forward','fw')}${it('pin',(m.pin||[]).includes(S.me.id)?'Unpin':'Pin','pn')}${mine&&m.text&&!m.media?it('edit','Edit','ed'):''}${it('del','Delete','dl',1)}`)};
Act.react=async el=>{await api('/react',{chat:cid(),id:sm().id,emoji:el.dataset.e});poll()};
Act.rc=async el=>{await api('/react',{chat:cid(),id:+el.dataset.i,emoji:el.dataset.e});poll()};
const bar=()=>{const b=$('#rb'),m=S.edit?S.ms.find(x=>x.id===S.edit):S.rep;b.hidden=!m;if(m)b.innerHTML=`<div class="row badge" style="border-radius:0">${ic(S.edit?'edit':'reply')}<div class="fx sn">${S.edit?'Editing: ':''}${rich(m.text||'['+(m.media&&m.media.type)+']')}</div><button class="ib" data-a="barx">${ic('close')}</button></div>`};
Act.barx=()=>{S.rep=S.edit=null;$('#inp').value='';bar()};
Act.rep=()=>{S.rep=S.sm;S.edit=null;bar();$('#inp').focus()};
Act.cp=()=>{navigator.clipboard.writeText(S.sm.text);toast('Copied')};
Act.ed=()=>{S.edit=S.sm.id;S.rep=null;$('#inp').value=S.sm.text;bar();$('#inp').focus()};
Act.dl=async()=>{const c=S.cur,r=await dlg({t:'Delete message?',cb:c.saved?'':`also delete for ${nm(ct(c))}`,ok:'Delete',red:1});if(r.ok){await api('/delete',{chat:cid(),id:S.sm.id,both:r.cb});poll()}};
Act.pn=async()=>{const c=S.cur,m=S.sm,un=(m.pin||[]).includes(S.me.id),r=await dlg({t:un?'Unpin message?':'Pin message?',cb:c.saved?'':`also ${un?'unpin':'pin'} for ${nm(ct(c))}`,ok:un?'Unpin':'Pin'});if(r.ok){await api('/pin',{chat:cid(),id:m.id,both:r.cb,un});poll()}};
Act.fw=async()=>{const m=S.sm,r=await dlg({t:'Forward to…',o:S.ch.map(c=>nm(ct(c)))});if(r.i<0)return;const j=await api('/send',{chat:S.ch[r.i].chat,text:m.text,media:m.media,fwd:m.from===S.me.id?S.me.name:S.cur.peer.name});toast(esc(j.err||'Forwarded'))};
async function snd(media){const i=$('#inp'),t=i.value.trim();if(!t&&!media)return;if(S.edit){await api('/edit',{chat:cid(),id:S.edit,text:t});S.edit=null}else{const rp=S.rep&&{id:S.rep.id,name:S.rep.from===S.me.id?S.me.name:S.cur.peer.name,text:S.rep.text||'['+(S.rep.media&&S.rep.media.type)+']'};const j=await api('/send',{chat:cid(),text:t,media,reply:rp});if(!ok(j))return;merge(j.msg)}i.value='';i.oninput();S.rep=null;bar();S.sb=1;drawMs();S.sb=0;poll()}
let rec,chunks;
Act.sendmic=async()=>{if($('#inp').value.trim()||S.edit)return snd();const b=$('#sbtn');if(rec){rec.stop();return}if(!(await MSNotify.askMedia('mic')))return toast('Microphone permission needed');const s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());rec=null;b.style.background='';const m=await up(new File(chunks,'voice.webm',{type:'audio/webm'}),'voice');m&&snd(m)};rec.start();b.style.background='#e33';toast('Recording… tap again to send')};
async function up(f,type){toast('Uploading…');try{const {upload}=await import('https://esm.sh/@vercel/blob@0.27.0/client');const b=await upload('f/'+S.me.id+'/'+Date.now()+'-'+f.name,f,{access:'public',handleUploadUrl:'/api/upload',clientPayload:S.ac[S.ai].token});return{url:b.url,name:f.name,size:f.size,type:type||(f.type.startsWith('image')?'image':f.type.startsWith('video')?'video':f.type.startsWith('audio')?'audio':'file')}}catch(e){toast('Upload failed');return null}}
const fl=$('#fl');
fl.onchange=async()=>{const f=fl.files[0];fl.value='';if(!f)return;if(S.fm==='av'){const m=await up(f,'image');if(m){const j=await api('/me/update',{avatar:m.url});if(ok(j)){S.me=j.me;toast('Photo updated');Act.mypf(1)}}}else if(S.fm==='wp'){const r=new FileReader();r.onload=()=>{S.st.wu=r.result;sv();toast('Wallpaper set')};r.readAsDataURL(f)}else{const m=await up(f);m&&snd(m)}S.fm=0};
Act.attach=()=>{fl.accept='*/*';fl.removeAttribute('capture');fl.click()};

Act.view=el=>{const d=$('#dlg');d.innerHTML=`<div class="ov" style="padding:0"><img src="${el.src}" style="max-width:100%;max-height:100%"></div>`;d.onclick=()=>d.innerHTML=''};
Act.cmenu=()=>{const c=S.cur;sheet(it('up','Go to first message','first')+(c.mute?it('mute','Unmute','unm'):it('mute','Mute','mu'))+it('del','Clear chat','clr')+it('del','Delete chat','dch',1))};
Act.first=()=>loadMs('first');
Act.unm=async()=>{await api('/chat/mute',{chat:cid(),until:0});S.cur.mute=0;toast('Notifications enabled')};
Act.mu=async()=>{const r=await dlg({t:'Mute',o:['Disable sound','Mute for…','Mute forever']});if(r.i<0)return;let u=-2,msg='Sound disabled';if(r.i===1){const d=await dlg({t:'Mute for',o:['1 hour','8 hours','2 days','7 days']});if(d.i<0)return;u=Date.now()+[1,8,48,168][d.i]*36e5;msg='Muted for '+['1 hour','8 hours','2 days','7 days'][d.i]}if(r.i===2){u=-1;msg='Muted forever'}await api('/chat/mute',{chat:cid(),until:u});S.cur.mute=u;toast(msg)};
Act.clr=async()=>{const c=S.cur,r=await dlg({t:'Clear chat?',cb:c.saved?'':`also delete for ${nm(ct(c))}`,ok:'Clear',red:1});if(r.ok){await api('/chat/clear',{chat:cid(),both:r.cb});S.ms=[];drawMs()}};
Act.dch=async()=>{const c=S.cur,r=await dlg({t:'Delete chat?',cb:c.saved?'':`also delete for ${nm(ct(c))}`,ok:'Delete',red:1});if(r.ok){await api('/chat/delete',{chat:cid(),both:r.cb});Act.back()}};

Act.sp=()=>{S.fm='av';fl.accept='image/*';fl.removeAttribute('capture');fl.click()};
Act.ei=()=>{const u=S.me;page('Edit info',`<input id="en" class="inp" placeholder="Name" value="${esc(u.name)}"><input id="eb" class="inp" placeholder="Bio" value="${esc(u.bio)}" maxlength="120"><input id="eu" class="inp" placeholder="Username" value="${esc(u.username)}"><input id="ed" class="inp" type="date" value="${esc(u.dob)}"><div class="badge sec">${rw('mail','Change email',esc(u.email),'cem')}</div><button class="btn" data-a="esv">Done</button>`)};
Act.esv=async()=>{const j=await api('/me/update',{name:$('#en').value,bio:$('#eb').value,username:$('#eu').value,dob:$('#ed').value});if(ok(j)){S.me=j.me;toast('Saved');Act.pback()}};
Act.cem=async()=>{const e=await ask('New email','Email','email');if(!e)return;const p=await ask('Enter your password');if(!p)return;const j=await api('/me/update',{email:e,password:p});if(ok(j)){S.me=j.me;toast('Email changed')}};
Act.setg=()=>{page('Settings',`<div class="badge sec">${rw('person','Account','Name, bio, username, birthday','ei')}${rw('img','Chat Settings','Text size, wallpapers','chs')}${rw('lock','Privacy and Security','','prv')}${rw('mute','Notifications','Enable push on this device','pushon2')}</div>`,`<button class="ib" data-a="lgp">${ic('more')}</button>`)};
Act.pushon2=async()=>{await Act.pushon();toast('Notifications: '+Notification.permission)};
Act.chs=()=>page('Chat Settings',`<div class="badge sec" style="padding:14px"><b>Message text size</b><input type="range" min="12" max="24" value="${S.st.fs}" style="width:100%" oninput="S.st.fs=this.value;document.documentElement.style.setProperty('--fs',this.value+'px');sv()"></div><div class="badge sec"><div class="wps">${WP.map((w,i)=>`<div data-a="wpp" data-i="${i}" style="background:${w}"></div>`).join('')}</div>${rw('img','Wallpaper from gallery','','wpg')}${rw('clip','Wallpaper from URL','','wpu')}</div>`);
Act.wpp=el=>{S.st.wp=+el.dataset.i;S.st.wu='';sv();toast('Wallpaper set')};
Act.wpg=()=>{S.fm='wp';fl.accept='image/*';fl.removeAttribute('capture');fl.click()};
Act.wpu=async()=>{const u=await ask('Image URL','https://…','url');if(u){S.st.wu=u;sv();toast('Wallpaper set')}};
Act.prv=()=>page('Privacy and Security',`<div class="badge sec">${rw('lock','Two-step verification',S.me.two?'On':'Off','two')}${rw('lock','Passcode lock',S.me.pass?'On':'Off','pass')}${rw('mail','Change email',esc(S.me.email),'cem')}${rw('block','Blocked users','','bls')}${rw('dev','Devices','','dv')}${rw('person','Last seen',S.me.hideSeen?'Hidden (others see "recently")':'Everyone','ls')}</div>`);
Act.ls=async()=>{const j=await api('/me/update',{hideSeen:!S.me.hideSeen});if(ok(j)){S.me=j.me;Act.pback();Act.prv()}};
async function secFlow(kind,label){const on=kind==='pass'?S.me.pass:S.me.two;if(!on){const v=await ask('New '+label);if(!v)return;if(!ok(await api('/sec/set',{kind,value:v})))return}else{const r=await dlg({t:label,o:['Change','Remove']});if(r.i<0)return;const cur=await ask('Current '+label);if(!cur)return;if(r.i===0){const v=await ask('New '+label);if(!v)return;if(!ok(await api('/sec/set',{kind,value:v,current:cur})))return}else if(!ok(await api('/sec/remove',{kind,value:cur})))return}S.me=(await api('/me')).me;toast('Done')}
Act.two=()=>secFlow('two','password');Act.pass=()=>secFlow('pass','passcode');
Act.bls=async()=>{const j=await api('/blocked');page('Blocked users',(j.users||[]).map(u=>`<div class="row" data-a="ubl" data-i="${u.id}">${av(u)}<div class="fx"><b>${nm(u.name)}</b><br><small>Tap to unblock</small></div></div>`).join('')||'<p style="padding:20px;opacity:.6">No blocked users</p>')};
Act.ubl=async el=>{await api('/block',{peer:el.dataset.i,block:false});Act.pback();Act.bls()};
Act.dv=async()=>{const j=await api('/devices');page('Devices',(j.devices||[]).map(d=>`<div class="row" data-a="tdev" data-i="${d.id}">${tl('dev')}<div class="fx"><div class="sn">${esc(d.ua||'Unknown')}</div><small>${new Date(d.ts).toLocaleString()} ${d.current?'· This device':'· tap to log out'}</small></div></div>`).join(''))};
Act.tdev=async el=>{const r=await dlg({t:'Log out this device?',ok:'Log out',red:1});if(r.ok){await api('/devices/logout',{id:el.dataset.i});Act.pback();Act.dv()}};
Act.lgp=()=>sheet(it('logout','Logout','lgo'));
Act.lgo=()=>page('Logout',`<div class="badge sec">${rw('del','Delete account permanently','','delacc')}${rw('logout','Logout','','lo')}</div>`);
function localLogout(){S.ac.splice(S.ai,1);S.ai=0;sv();S.me=null;S.ni=1;$('#pg').hidden=true;$('#cv').hidden=true;boot()}
Act.lo=async()=>{const r=await dlg({t:'Logout?',p:'You will need to login again on this device.',ok:'Logout',red:1});if(r.ok){try{await MSNotify.unregisterDevice()}catch(e){}await api('/auth/logout',{});localLogout()}};
Act.delacc=async()=>{const j=await api('/account/delete-start',{});if(j.err==='setup2fa'){const r=await dlg({t:'Set up first',p:'Set Two-step verification or a passcode before deleting your account.',ok:'Set up'});if(r.ok)Act.two();return}if(!ok(j))return;if(j.debug)toast('Code: '+j.debug);const code=await ask('Email code','6-digit code','tel');if(!code)return;const b={code};if(j.need.two){b.two=await ask('Two-step password');if(!b.two)return}if(j.need.pass){b.pass=await ask('Passcode');if(!b.pass)return}const d=await api('/account/delete-confirm',b);if(ok(d))localLogout()};

/* ---------- realtime (polling) ---------- */
async function poll(){if(!S.me||!S.ac[S.ai])return;const j=await api('/updates?after='+S.v);if(!j.items)return;S.v=j.v;S.n=(S.n||0)+1;if(!j.items.length&&S.n%6)return;let d=0,inn=0;for(const x of j.items){const cur=S.cur&&x.chat===S.cur.chat;if(cur&&x.rd!==undefined){S.pr=x.rd;d=1}if(x.msg){if(cur){merge(x.msg);d=1;if(!x.msg.gone&&x.msg.from!==S.me.id)api('/read',{chat:x.chat})}else if(!x.msg.gone&&x.msg.from!==S.me.id)inn=x.chat}}await loadChats();if(inn){const c=S.ch.find(y=>y.chat===inn);if(c&&!c.mute)MSNotify.playSound()}if(d)drawMs()}
setInterval(poll,2500);
boot();
</script>
</body>
</html>
