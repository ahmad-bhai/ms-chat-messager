<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MS Chat</title>
<meta name="theme-color" content="#0b0713">
<link rel="icon" href="https://magic-scripts.vercel.app/logo.svg">
<style>
:root{--bg:#0b0713;--bb:rgba(38,32,52,.72);--bd:rgba(255,255,255,.14);--tx:#fff;--soft:#D0BDF4;--ac:#C54FDA;--grad:linear-gradient(135deg,#E120E4,#C54FDA 50%,#9B0BE1);--mine:rgba(155,11,225,.5);--g1:rgba(155,11,225,.35);--g2:rgba(225,32,228,.22);--red:#ff5b7a}
[data-theme=light]{--bg:#f1ecf8;--bb:rgba(255,255,255,.78);--bd:rgba(0,0,0,.1);--tx:#1a1330;--soft:#6a3fb5;--mine:rgba(197,79,218,.3);--g1:rgba(155,11,225,.18);--g2:rgba(225,32,228,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Poppins',-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--tx);overflow:hidden;background:radial-gradient(circle at 15% 0,var(--g1),transparent 45%),radial-gradient(circle at 90% 100%,var(--g2),transparent 45%),var(--bg);background-attachment:fixed}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:var(--tx);outline:0;border:0}
svg{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bdg{background:var(--bb);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--bd);border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.pill{border-radius:999px}
.fld{width:100%;min-height:52px;padding:13px 18px;font-size:16px}
.fld::placeholder{color:rgba(150,140,170,.85)}
.fld:focus{border-color:var(--ac)}
.btn{width:100%;padding:14px;font-weight:700;color:#fff;background:var(--grad);border:1px solid rgba(255,255,255,.25);box-shadow:0 8px 22px rgba(155,11,225,.4)}
.btn:active,.rb:active,.row:active{transform:scale(.96)}
.rb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 46px;color:var(--soft)}
.rb.g{background:var(--grad);color:#fff;border:0}
.lnk{padding:10px 18px;font-size:13px;font-weight:700;color:var(--soft)}
.row{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 18px;font-weight:600}
.red{color:var(--red)}
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.col{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{width:120px;height:120px;border-radius:50%;padding:10px;display:flex}
.logo img{width:100%;height:100%;border-radius:50%}
.ttl{padding:9px 26px;font-size:1.4rem;font-weight:800}
#app{display:flex;height:100%;position:relative}
#side{width:370px;max-width:42%;min-width:300px;display:flex;flex-direction:column;padding:10px;gap:10px}
#main{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center}
#chat{position:absolute;inset:0;display:flex;flex-direction:column;padding:10px;gap:8px}
.bar{display:flex;align-items:center;gap:8px;padding-top:env(safe-area-inset-top)}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ci{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer}
.ci b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{display:block;color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci>div{flex:1;min-width:0}.ci time{font-size:11px;color:var(--soft)}
.av{width:48px;height:48px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:0 0 48px}
.note{padding:12px 20px;font-size:14px;color:var(--soft);text-align:center}
.hdr{flex:1;display:flex;align-items:center;gap:10px;padding:5px 16px 5px 6px;min-width:0}.hdr b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding:4px 2px}
#msgs>:first-child{margin-top:auto}
.m{display:flex;flex-direction:column}.m.o{align-items:flex-end}.m.i{align-items:flex-start}
.bub{max-width:min(82%,520px);padding:8px 13px;border-radius:20px;line-height:1.4;word-break:break-word;cursor:pointer}
.i .bub{background:var(--bb);border:1px solid var(--bd);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-left-radius:6px}
.o .bub{background:var(--mine);border:1px solid var(--bd);border-bottom-right-radius:6px}
.bub a,.bub .u{color:var(--soft);font-weight:600;text-decoration:underline;cursor:pointer}
.mt{display:block;text-align:right;font-size:10.5px;color:var(--soft);margin-top:2px;font-style:normal}
.q{border-left:3px solid var(--ac);padding:2px 8px;margin-bottom:4px;font-size:13px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em{width:1.25em;height:1.25em;vertical-align:-.28em}
.bub.big{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:2px}
.big .em{width:96px;height:96px;animation:bn 1.6s ease-in-out infinite}
@keyframes bn{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.08)}60%{transform:translateY(0) scale(.96)}}
.rxs{display:flex;gap:4px;margin-top:2px}
.rx{padding:2px 8px;font-size:12px;display:flex;align-items:center;gap:3px;border-radius:999px}.rx img{width:16px;height:16px}.rx.me{border-color:var(--ac)}
#rep{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:13px}#rep span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid var(--ac);padding-left:8px}
.cmp{display:flex;align-items:flex-end;gap:8px;padding-bottom:env(safe-area-inset-bottom)}
#mi{flex:1;max-height:130px;resize:none;border-radius:24px}
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.dp{position:absolute;left:0;top:0;bottom:0;width:min(86%,320px);background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pm{width:100%;max-width:380px;background:var(--bg);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--bd)}
#cx{position:fixed;z-index:60;padding:8px;min-width:190px;display:flex;flex-direction:column;gap:2px}
#cx .rr{display:flex;justify-content:space-between;padding:2px 4px 6px}#cx .rr img{width:28px;height:28px;cursor:pointer}
#cx button{padding:9px 12px;text-align:left;border-radius:12px;font-size:15px}#cx button:active{background:var(--bd)}
.cb{display:flex;gap:10px;align-items:center;padding:6px 4px;font-size:14px}.cb input{width:18px;height:18px;accent-color:#C54FDA}
.two{display:flex;gap:8px}.two button{flex:1;padding:12px;font-weight:700;border-radius:999px}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);padding:11px 22px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){#side{width:100%;max-width:100%}#main{position:absolute;inset:0;transform:translateX(100%);transition:transform .25s;z-index:5;background:var(--bg)}#app.co #main{transform:none}}
@media(min-width:761px){#bk{display:none}}
@media(prefers-reduced-motion:reduce){.big .em{animation:none}}
</style>
</head>
<body>
<div id="auth" class="scr"><div class="col">
 <div class="bdg logo"><img src="https://magic-scripts.vercel.app/logo.svg" alt=""></div>
 <div class="bdg pill ttl">MS CHAT</div>
 <input id="em" class="bdg fld" type="email" placeholder="Email" autocomplete="email">
 <input id="pw" class="bdg fld" type="password" placeholder="Password (min 6)">
 <input id="nm" class="bdg fld rg hide" placeholder="Your name" maxlength="40">
 <input id="un" class="bdg fld rg hide" placeholder="Username (letters, numbers, _)" maxlength="20" autocapitalize="none">
 <button id="go" class="btn pill">Sign in</button>
 <button id="sw" class="lnk bdg pill">Create a new account</button>
</div></div>

<div id="app" class="hide">
 <aside id="side">
  <div class="bar"><button id="mb" class="rb bdg" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><input id="sq" class="bdg fld pill" placeholder="Search @username" autocomplete="off"></div>
  <div id="list"></div>
 </aside>
 <main id="main">
  <div id="empty" class="bdg pill note">Select a chat to start messaging</div>
  <section id="chat" class="hide">
   <header class="bar"><button id="bk" class="rb bdg" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><div id="hd" class="bdg pill hdr"></div></header>
   <div id="msgs"></div>
   <div id="rep" class="bdg pill hide"><span id="rt"></span><button id="rx" aria-label="Cancel">✕</button></div>
   <footer class="cmp"><textarea id="mi" rows="1" class="bdg fld" placeholder="Message" maxlength="4000"></textarea><button id="sd" class="rb g" aria-label="Send"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg></button></footer>
  </section>
 </main>
</div>

<div id="dw" class="ov hide" style="justify-content:flex-start;align-items:stretch;padding:0"><div class="dp">
 <div class="bdg logo" style="width:96px;height:96px"><img src="https://magic-scripts.vercel.app/logo.svg" alt=""></div>
 <div id="dn" class="bdg pill ttl" style="font-size:1rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
 <div id="du" class="bdg pill note" style="padding:6px 16px"></div>
 <button id="th" class="bdg pill row"><span>Theme</span><span id="ti">☀</span></button>
 <button id="pf" class="bdg pill row">My profile</button>
 <button id="lo" class="bdg pill row red">Log out</button>
</div></div>

<div id="pm" class="ov hide"><div class="pm">
 <div class="bdg pill ttl" style="align-self:center;font-size:1rem">My profile</div>
 <input id="pn" class="bdg fld" placeholder="Name" maxlength="40">
 <input id="pb" class="bdg fld" placeholder="Bio" maxlength="120">
 <div class="two"><button id="pc" class="bdg">Cancel</button><button id="ps" class="btn">Save</button></div>
</div></div>

<div id="dg" class="ov hide"><div class="pm">
 <div id="dt" class="bdg pill ttl" style="align-self:center;font-size:1rem"></div>
 <label id="dl" class="bdg pill cb hide" style="padding:10px 16px"><input type="checkbox" id="dc"><span id="dx"></span></label>
 <div class="two"><button id="dn2" class="bdg">Cancel</button><button id="dok" class="btn">Delete</button></div>
</div></div>

<div id="cx" class="bdg hide"></div>
<div id="toast" class="bdg pill"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,query,where,orderBy,limit,onSnapshot,addDoc,serverTimestamp,runTransaction,arrayUnion,deleteField}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyD7Nt1wwgGy5GxKFrc1NQvv8ulA3fDSJQE",authDomain:"ms-chat-517b8.firebaseapp.com",projectId:"ms-chat-517b8",storageBucket:"ms-chat-517b8.firebasestorage.app",messagingSenderId:"34240289213",appId:"1:34240289213:web:d9f18bcfa824bbac5e1ad4"});
const auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UR=/^[a-z0-9_]{3,20}$/i;
const EMO='\\p{Extended_Pictographic}(?:[\\uFE0F\\u{1F3FB}-\\u{1F3FF}]|\\u200D\\p{Extended_Pictographic})*';
const TOK=new RegExp('(https?:\\/\\/[^\\s<]+)|(@[a-z0-9_]{3,20})|('+EMO+')','giu'),ONLY=new RegExp('^(?:'+EMO+')$','u');
const emg=e=>`<img class="em" src="https://magic-scripts-emojis.vercel.app/emoji/?id=${encodeURIComponent(e)}" alt="${esc(e)}">`;
const COL=['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae'];
let me=null,prof=null,cid=null,peer=null,msgs=[],chats=[],U={},reply=null,editing=null,unM=null,unC=null,mode='in',reg=false,found=null,tmr;
const pending=location.pathname.replace(/^\/+|\/+$/g,'');

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove('on'),2600)}
function fmt(t){let o='',i=0,m;TOK.lastIndex=0;
 while((m=TOK.exec(t))){o+=esc(t.slice(i,m.index));i=TOK.lastIndex;
  if(m[1]){const u=m[1],b=location.origin+'/',n=u.startsWith(b)?u.slice(b.length).replace(/\/$/,''):'';o+=UR.test(n)?`<span class="u" data-u="${esc(n)}">${esc(u)}</span>`:`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`}
  else if(m[2])o+=`<span class="u" data-u="${esc(m[2].slice(1))}">${esc(m[2])}</span>`;
  else o+=emg(m[3])}
 return o+esc(t.slice(i)).replace(/\n/g,'<br>')}
const tm=ts=>(ts&&ts.toDate?ts.toDate():new Date()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const av=u=>u.photo?`<img class="av" src="${esc(u.photo)}" alt="">`:`<div class="av" style="background:${COL[(u.name||'?').charCodeAt(0)%7]}">${esc((u.name||'?')[0].toUpperCase())}</div>`;
async function getUser(id){if(U[id])return U[id];const s=await getDoc(doc(db,'users',id));return U[id]=s.exists()?{id,...s.data()}:{id,name:'Deleted user',username:''}}
const other=c=>c.members.find(x=>x!==me.uid);

/* ---------- theme ---------- */
function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem('ms_theme',t);$('#ti').textContent=t==='dark'?'☀':'☾';$('meta[name=theme-color]').content=t==='dark'?'#0b0713':'#f1ecf8'}
theme(localStorage.getItem('ms_theme')||'dark');
$('#th').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---------- auth ---------- */
$('#sw').onclick=()=>{mode=mode==='in'?'up':'in';document.querySelectorAll('.rg').forEach(e=>e.classList.toggle('hide',mode==='in'));$('#go').textContent=mode==='in'?'Sign in':'Sign up';$('#sw').textContent=mode==='in'?'Create a new account':'I already have an account'};
$('#go').onclick=async()=>{const e=$('#em').value.trim(),p=$('#pw').value;if(!e||!p)return toast('Enter email and password');
 try{if(mode==='in')return await signInWithEmailAndPassword(auth,e,p);
  const n=$('#nm').value.trim(),u=$('#un').value.trim().replace(/^@/,'');
  if(!n||!UR.test(u))return toast('Name and a 3-20 character username are required');
  reg=true;const cr=await createUserWithEmailAndPassword(auth,e,p);
  try{await runTransaction(db,async t=>{const r=doc(db,'usernames',u.toLowerCase());if((await t.get(r)).exists())throw new Error('taken');t.set(r,{uid:cr.user.uid});t.set(doc(db,'users',cr.user.uid),{name:n,username:u,ul:u.toLowerCase(),bio:'',email:e})})}
  catch(x){await cr.user.delete();reg=false;return toast(x.message==='taken'?'Username is taken':'Could not create the profile')}
  reg=false;boot(cr.user)}
 catch(x){reg=false;toast((x.code||'error').replace('auth/','').replace(/-/g,' '))}};
onAuthStateChanged(auth,u=>{if(reg)return;u?boot(u):($('#app').classList.add('hide'),$('#auth').classList.remove('hide'))});
$('#lo').onclick=async()=>{unC&&unC();unM&&unM();U={};closeChat();$('#dw').classList.add('hide');await signOut(auth)};

async function boot(u){me=u;prof=await getUser(u.uid);if(!prof.username){toast('Profile missing');return signOut(auth)}
 $('#auth').classList.add('hide');$('#app').classList.remove('hide');$('#dn').textContent=prof.name;$('#du').textContent='@'+prof.username;
 unC&&unC();unC=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),async s=>{chats=s.docs.map(d=>({id:d.id,...d.data()}));await Promise.all(chats.map(c=>getUser(other(c))));if(!$('#sq').value.trim())renderList()});
 if(UR.test(pending)&&pending!=='index'){openByName(pending);history.replaceState(null,'','/')}}

/* ---------- chat list + search ---------- */
function renderList(){const l=$('#list');if(!chats.length){l.innerHTML='<div class="note">No chats yet.<br>Search a @username above to start.</div>';return}
 l.innerHTML=chats.slice().sort((a,b)=>(b.updated?.seconds||9e9)-(a.updated?.seconds||9e9)).map(c=>{const u=U[other(c)];return`<div class="bdg ci" data-c="${esc(u.id)}">${av(u)}<div><b>${esc(u.name)}</b><small>${c.last?(c.last.from===me.uid?'You: ':'')+esc(c.last.text):'No messages yet'}</small></div><time>${c.updated?tm(c.updated):''}</time></div>`}).join('')}
$('#sq').oninput=e=>{clearTimeout(found);const q=e.target.value.trim().replace(/^@/,'').toLowerCase();if(!q)return renderList();
 found=setTimeout(async()=>{const s=await new Promise(r=>{const un=onSnapshot(query(collection(db,'users'),where('ul','>=',q),where('ul','<=',q+'\uf8ff'),limit(15)),x=>{un();r(x)},()=>r({docs:[]}))});
  const us=s.docs.filter(d=>d.id!==me.uid).map(d=>({id:d.id,...d.data()}));us.forEach(u=>U[u.id]=u);
  $('#list').innerHTML=us.length?us.map(u=>`<div class="bdg ci" data-c="${esc(u.id)}">${av(u)}<div><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div></div>`).join(''):'<div class="note">No users found.</div>'},250)};
$('#list').onclick=e=>{const c=e.target.closest('[data-c]');if(c){$('#sq').value='';openWith(c.dataset.c)}};
async function openByName(n){const s=await getDoc(doc(db,'usernames',n.toLowerCase()));if(!s.exists())return toast('User not found');if(s.data().uid===me.uid)return toast('That is you');openWith(s.data().uid)}
document.addEventListener('click',e=>{const u=e.target.closest('.u[data-u]');if(u){e.preventDefault();openByName(u.dataset.u)}if(!e.target.closest('#cx,.bub'))$('#cx').classList.add('hide')});

/* ---------- chat ---------- */
async function openWith(uid){peer=await getUser(uid);cid=[me.uid,uid].sort().join('_');reply=editing=null;clr();
 $('#empty').classList.add('hide');$('#chat').classList.remove('hide');$('#app').classList.add('co');
 $('#hd').innerHTML=`${av(peer).replace('class="av"','class="av" style="width:38px;height:38px;flex-basis:38px"').replace('<div class="av" style="','<div class="av" style="width:38px;height:38px;flex-basis:38px;')}<div style="min-width:0"><b>${esc(peer.name)}</b><small style="display:block;color:var(--soft);font-size:12px">@${esc(peer.username)}</small></div>`;
 renderList();unM&&unM();msgs=[];$('#msgs').innerHTML='';
 unM=onSnapshot(query(collection(db,'chats',cid,'messages'),orderBy('ts')),s=>{msgs=s.docs.map(d=>({id:d.id,...d.data()})).filter(m=>!(m.del||[]).includes(me.uid));draw()},()=>toast('Cannot load messages'))}
function closeChat(){unM&&unM();unM=null;cid=null;$('#chat').classList.add('hide');$('#empty').classList.remove('hide');$('#app').classList.remove('co')}
$('#bk').onclick=closeChat;
function draw(){const a=$('#msgs'),near=a.scrollHeight-a.scrollTop-a.clientHeight<160;
 a.innerHTML=msgs.map(m=>{const o=m.from===me.uid,big=ONLY.test(m.text.trim()),rs={};Object.values(m.reactions||{}).forEach(e=>rs[e]=(rs[e]||0)+1);
  const mine=(m.reactions||{})[me.uid];
  return`<div class="m ${o?'o':'i'}" data-id="${m.id}"><div class="bub ${big?'big':''}">${m.reply?`<div class="q">${esc(m.reply.text)}</div>`:''}<span>${fmt(m.text)}</span>${big?'':`<i class="mt">${m.edited?'edited ':''}${tm(m.ts)}</i>`}</div>${Object.keys(rs).length?`<div class="rxs">${Object.entries(rs).map(([e,n])=>`<span class="bdg rx ${e===mine?'me':''}" data-r="${esc(e)}">${emg(e)}${n>1?n:''}</span>`).join('')}</div>`:''}</div>`}).join('');
 if(near)a.scrollTop=a.scrollHeight}

/* ---------- send / edit ---------- */
const mi=$('#mi');mi.oninput=()=>{mi.style.height='auto';mi.style.height=Math.min(mi.scrollHeight,130)+'px'};
mi.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!matchMedia('(pointer:coarse)').matches){e.preventDefault();send()}};
$('#sd').onpointerdown=e=>e.preventDefault();$('#sd').onclick=send;
function clr(){mi.value='';mi.style.height='auto';reply=editing=null;$('#rep').classList.add('hide')}
$('#rx').onclick=clr;
async function send(){const t=mi.value.trim();if(!t||!cid)return;
 try{if(editing){await updateDoc(doc(db,'chats',cid,'messages',editing.id),{text:t,edited:true});return clr()}
  const r=reply;clr();
  await setDoc(doc(db,'chats',cid),{members:[me.uid,peer.id],last:{text:t.slice(0,100),from:me.uid},updated:serverTimestamp()},{merge:true});
  await addDoc(collection(db,'chats',cid,'messages'),{from:me.uid,text:t,ts:serverTimestamp(),reply:r,reactions:{},del:[]})}
 catch(x){toast('Could not send')}}

/* ---------- message menu ---------- */
const QR=['👍','❤️','😂','😮','😢','🙏'];
$('#msgs').onclick=e=>{if(e.target.closest('a,.u'))return;
 const rx=e.target.closest('[data-r]');if(rx){return react(e.target.closest('.m').dataset.id,rx.dataset.r)}
 const b=e.target.closest('.bub');if(!b)return;const m=msgs.find(x=>x.id===b.closest('.m').dataset.id);if(!m)return;
 const o=m.from===me.uid,cx=$('#cx');
 cx.innerHTML=`<div class="rr">${QR.map(q=>`<span data-q="${q}">${emg(q)}</span>`).join('')}</div><button data-a="reply">Reply</button><button data-a="copy">Copy</button>${o?'<button data-a="edit">Edit</button>':''}<button data-a="del" class="red">Delete</button>`;
 cx.classList.remove('hide');const r=b.getBoundingClientRect();cx.style.left=Math.max(8,Math.min(r.left,innerWidth-cx.offsetWidth-8))+'px';cx.style.top=Math.max(8,Math.min(r.bottom+6,innerHeight-cx.offsetHeight-8))+'px';cx.dataset.id=m.id;e.stopPropagation()};
$('#cx').onclick=async e=>{const m=msgs.find(x=>x.id===$('#cx').dataset.id);$('#cx').classList.add('hide');if(!m)return;
 const q=e.target.closest('[data-q]');if(q)return react(m.id,q.dataset.q);
 const a=e.target.closest('button')?.dataset.a;
 if(a==='reply'){reply={id:m.id,text:m.text.slice(0,80),from:m.from};$('#rt').textContent=m.text.slice(0,80);$('#rep').classList.remove('hide');mi.focus()}
 if(a==='copy'){try{await navigator.clipboard.writeText(m.text);toast('Copied')}catch{toast('Copy not allowed')}}
 if(a==='edit'){editing=m;mi.value=m.text;mi.oninput();$('#rt').textContent='Edit: '+m.text.slice(0,70);$('#rep').classList.remove('hide');mi.focus()}
 if(a==='del'){const own=m.from===me.uid,r=await ask('Delete message?',own?`Also delete for ${peer.name}`:null,'Delete');if(!r)return;
  try{r.cb?await deleteDoc(doc(db,'chats',cid,'messages',m.id)):await updateDoc(doc(db,'chats',cid,'messages',m.id),{del:arrayUnion(me.uid)})}catch{toast('Could not delete')}}};
async function react(id,e){const m=msgs.find(x=>x.id===id);if(!m)return;const same=(m.reactions||{})[me.uid]===e;
 try{await updateDoc(doc(db,'chats',cid,'messages',id),{['reactions.'+me.uid]:same?deleteField():e})}catch{toast('Could not react')}}

/* ---------- custom dialog ---------- */
function ask(title,cbLabel,ok){return new Promise(res=>{$('#dt').textContent=title;$('#dl').classList.toggle('hide',!cbLabel);$('#dx').textContent=cbLabel||'';$('#dc').checked=false;$('#dok').textContent=ok;$('#dg').classList.remove('hide');
 const end=v=>{$('#dg').classList.add('hide');res(v)};$('#dn2').onclick=()=>end(null);$('#dok').onclick=()=>end({cb:$('#dc').checked})})}

/* ---------- drawer + profile ---------- */
$('#mb').onclick=()=>$('#dw').classList.remove('hide');
$('#dw').onclick=e=>{if(e.target.id==='dw')$('#dw').classList.add('hide')};
$('#pf').onclick=()=>{$('#dw').classList.add('hide');$('#pn').value=prof.name;$('#pb').value=prof.bio||'';$('#pm').classList.remove('hide')};
$('#pc').onclick=()=>$('#pm').classList.add('hide');
$('#ps').onclick=async()=>{const n=$('#pn').value.trim();if(!n)return toast('Name is required');
 try{await updateDoc(doc(db,'users',me.uid),{name:n,bio:$('#pb').value.trim()});prof=U[me.uid]={...prof,name:n,bio:$('#pb').value.trim()};$('#dn').textContent=n;$('#pm').classList.add('hide');toast('Profile saved')}catch{toast('Could not save')}};
</script>
</body>
