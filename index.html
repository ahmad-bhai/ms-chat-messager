<style>

  @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 15px rgba(197, 79, 218, 0.4); } 50% { box-shadow: 0 0 30px rgba(225, 32, 228, 0.75); } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    --bg: #0d0a14;
    --badge-bg: rgba(26, 20, 38, 0.75);
    --badge-border: rgba(255, 255, 255, 0.12);
    --tx: #f8f6ff;
    --soft: #c4b5fd;
    --ac: linear-gradient(135deg, #e120e4 0%, #c54fda 50%, #8b5cf6 100%);
    --me: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
    --in: rgba(255, 255, 255, 0.05);
    --fs: 15px;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  }

  [data-t=light] {
    --bg: #f4effc;
    --badge-bg: rgba(255, 255, 255, 0.88);
    --badge-border: rgba(139, 92, 246, 0.15);
    --tx: #1e1b2e;
    --soft: #6d28d9;
    --me: linear-gradient(135deg, #ddd6fe 0%, #c4b5fd 100%);
    --in: #ffffff;
    --shadow: 0 10px 30px rgba(109, 40, 217, 0.12);

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
  html, body { height: 100%; height: 100dvh; background: var(--bg); color: var(--tx); overflow: hidden; }
  [hidden] { display: none !important; }

  .i { width: 22px; height: 22px; fill: currentColor; flex: none; }
  .scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); z-index: 1; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #cv { z-index: 2; }
  #pg { z-index: 3; }
  #dr { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); }
  #sh { position: fixed; inset: 0; z-index: 110; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); }
  #dlg { position: fixed; inset: 0; z-index: 120; pointer-events: none; }
  #ts { position: fixed; left: 0; right: 0; bottom: 90px; z-index: 130; display: flex; justify-content: center; pointer-events: none; }
  .tt { background: rgba(20, 15, 32, 0.95); border: 1px solid var(--badge-border); color: #fff; border-radius: 999px; padding: 12px 24px; font-size: 14px; font-weight: 600; box-shadow: var(--shadow); animation: appPop 0.25s cubic-bezier(0.16, 1, 0.3, 1); }

  .badge { background: var(--badge-bg); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--badge-border); border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .badge.pill { border-radius: 999px; }
  .badge.fit { width: auto; }

  .hd { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 64px; flex-shrink: 0; }
  .fx { flex: 1; min-width: 0; }
  .ttl { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

  .ib, .tile { width: 44px; height: 44px; border-radius: 16px; border: 0; color: inherit; background: var(--in); display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; transition: all 0.2s; }

  .r1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }

  .fi { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: inherit; font: inherit; }

  .em { width: 1.3em; height: 1.3em; vertical-align: -0.3em; }
  .md { max-width: 100%; max-height: 280px; border-radius: 16px; display: block; margin-top: 6px; object-fit: cover; }

  .cmp { display: flex; gap: 10px; align-items: flex-end; padding: 12px 14px; background: var(--badge-bg); border-top: 1px solid var(--badge-border); flex-shrink: 0; }
  .cmp textarea { flex: 1; max-height: 120px; min-height: 44px; resize: none; border-radius: 22px; padding: 12px 18px; background: var(--in); border: 1.5px solid var(--badge-border); color: inherit; font: inherit; outline: 0; }

  .ov { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); pointer-events: auto; }
  .bx { width: 100%; max-width: 360px; padding: 24px; background: var(--bg); border-radius: 28px; border: 1px solid var(--badge-border); text-align: center; }
  .op { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 14px; font: inherit; border-radius: 14px; cursor: pointer; font-weight: 600; }
  .bt { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .bt button { background: none; border: 0; color: #c54fda; font-weight: 800; padding: 10px 16px; cursor: pointer; }

  .sheet { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 14px; background: var(--bg); border-radius: 28px; border: 1px solid var(--badge-border); }
  .it { display: flex; gap: 14px; align-items: center; padding: 14px 18px; border-radius: 16px; cursor: pointer; font-weight: 600; }
  .dw { width: 85%; max-width: 330px; height: 100%; background: var(--bg); overflow-y: auto; padding-top: env(safe-area-inset-top); border-right: 1px solid var(--badge-border); }
  
  .qr-box { width: 200px; height: 200px; background: #fff; padding: 10px; border-radius: 16px; margin: 16px auto; display: flex; align-items: center; justify-content: center; }
  #reader { width: 100%; max-width: 300px; margin: 10px auto; border-radius: 16px; overflow: hidden; }
</style>
</head>

async function api(p,b,q){
  let url='/api'+p;
  if(q){url+='?'+new URLSearchParams(q).toString()}
  const r=await fetch(url,{method:b?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(S.ac[S.ai]||{}).token},body:b?JSON.stringify(b):undefined});
  if(r.status===401&&S.me){localLogout();return{}}
  return r.json().catch(()=>({}))
}
const ok=j=>{if(j.err){toast(j.err);return false}return true};

function dlg(o){
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML=`<div class="ov"><div class="badge bx"><h3>${o.t}</h3>${o.p?`<p>${o.p}</p>`:''}${o.in?`<input id="di" class="inp" type="${o.ty||'text'}" placeholder="${o.in}" value="${o.v||''}">`:''}${(o.o||[]).map((x,i)=>`<button class="op" data-i="${i}">${x}</button>`).join('')}<div class="bt">${o.nc?'':'<button data-i="-1">Cancel</button>'}${o.ok?`<button data-i="-2">${o.ok}</button>`:''}</div></div></div>`;
    d.onclick=e=>{
      const b=e.target.closest('button'),bg=e.target.classList.contains('ov');
      if(!b&&!bg)return;
      const i=b?+b.dataset.i:-1,v=$('#di')&&$('#di').value;
      d.innerHTML='';
      res({ok:i===-2,i:i>=0?i:-1,v})
    };
    const x=$('#di');x&&x.focus()
  })
}

        </div>

    `;

  } else {
    app.innerHTML=`
      <div class="scr" style="overflow:auto;align-items:center;justify-content:center;padding:24px 16px;">
        <div class="badge bx" style="max-width:380px;width:100%;">
          <h2>Register</h2>
          ${fld('person','Name','an')}
          ${fld('person','Username','au')}
          ${fld('mail','Email','ae','email')}
          ${fld('lock','Password','ap','password')}
          <button class="btn" id="go">Register</button>
          <p style="margin-top:14px;cursor:pointer;color:var(--soft)" onclick="authScr('login')">Already have account? Login</p>
        </div>
      </div>
    `;
    $('#go').onclick=async()=>{
      const b={name:$('#an').value,username:$('#au').value,email:$('#ae').value,password:$('#ap').value};
      const j=await api('/auth/register',b);
      if(!ok(j))return;
      saveAcc(j.token,j.me);
    };
  }
}

async function initQR(){
  const j=await api('/auth/qr-init',{});
  if(!j.qid)return;
  $('#qrcode').innerHTML='';
  new QRCode($('#qrcode'),{text:j.qid,width:180,height:180});

  qrInterval=setInterval(async()=>{
    const res=await api('/auth/qr-check',null,{qid:j.qid});
    if(res.status==='approved'&&res.token){
      clearInterval(qrInterval);
      saveAcc(res.token,res.me);
    }
  },2000);
}

async function handleLogin(){
  const email=$('#ae').value, password=$('#ap').value;
  const otp=$('#a_otp')?$('#a_otp').value:undefined;
  const two=$('#a_two')?$('#a_two').value:undefined;

  const j=await api('/auth/login',{email,password,otp,two});
  if(!ok(j))return;

  if(j.needOtp&&!$('#a_otp')){
    toast(j.msg||'Enter OTP Code sent to email');
    if(j.debug)toast('Dev OTP: '+j.debug);
    $('#extra-f').innerHTML+=fld('mail','Enter OTP Code','a_otp');
    return;
  }

  if(j.need2fa&&!$('#a_two')){
    $('#extra-f').innerHTML+=fld('lock','Enter 2-Step Password','a_two');
    return;
  }

  if(j.token)saveAcc(j.token,j.me);
}

async function forgotPassword(){
  const email=await ask('Enter Account Email','email','email');
  if(!email)return;

  let res=await api('/auth/forgot-password',{email});
  if(!ok(res))return;
  if(res.debug)toast('Dev Reset Code: '+res.debug);

  const otp=await ask('Enter Email Reset Code','6-digit OTP');
  if(!otp)return;
  const newPassword=await ask('Enter New Password','New Password','password');
  if(!newPassword)return;

  res=await api('/auth/forgot-password',{email,otp,newPassword});
  if(ok(res))toast('Password updated! Please login.');
}

function saveAcc(token,me){
  const i=S.ac.findIndex(a=>a.id===me.id);
  if(i>=0)S.ac[i].token=token;else S.ac.push({token,id:me.id,name:me.name});
  S.ai=i>=0?i:S.ac.length-1;sv();boot();
}

/* ---------- BOOT APP & MAIN LOGIC ---------- */
async function boot(){
  clearInterval(qrInterval);
  document.documentElement.dataset.t=S.st.t;
  if(!S.ac[S.ai])S.ai=0;
  if(!S.ac.length){authScr('qr');return}
  const j=await api('/me');if(!j.me)return;
  S.me=j.me;S.ac[S.ai].name=j.me.name;sv();

  $('#cv').hidden=$('#pg').hidden=true;
  const c=await api('/chats');S.ch=c.chats||[];S.v=c.v||0;list();
}

const av=(u,z=46,saved)=>saved?`<span class="av badge" style="width:${z}px;height:${z}px;background:#2b7fc7">${ic('bm')}</span>`:u.avatar?`<img class="av badge" style="width:${z}px;height:${z}px" src="${u.avatar}">`:`<span class="av badge" style="width:${z}px;height:${z}px;background:#7c3aed">${Array.from(u.name||'?')[0]}</span>`;
const row=c=>`<div class="row badge" onclick="openC('${c.chat}')">${av(c.peer,52,c.saved)}<div class="fx"><div class="r1"><b>${c.saved?'Saved Messages':c.cn||c.peer.name}</b></div><div class="r1"><span class="sn">${c.last?c.last.text||'[Media]':''}</span></div></div></div>`;

function list(){
  $('#app').innerHTML=`<div class="scr"><div class="hd badge" style="border-radius:0 0 24px 24px;"><button class="ib" onclick="openDrawer()">${ic('menu')}</button><b class="ttl fx">MS Chat</b></div><div id="cl" style="overflow-y:auto;flex:1;padding:8px">${S.ch.map(row).join('')}</div></div>`;
}

async function openC(chatId){
  const c=S.ch.find(x=>x.chat===chatId)||(await api('/chats')).chats.find(x=>x.chat===chatId);
  if(!c)return;
  S.cur=c;
  $('#cv').hidden=false;
  $('#cv').innerHTML=`<div class="hd badge" style="border-radius:0"><button class="ib" onclick="$('#cv').hidden=true">${ic('back')}</button><b class="ttl fx">${c.saved?'Saved Messages':c.peer.name}</b></div><div id="ms"></div><div class="cmp"><textarea id="inp" placeholder="Message"></textarea><button class="tile" onclick="snd()">${ic('send')}</button></div>`;
  loadMsgs();
}

async function loadMsgs(){
  const j=await api('/msgs?chat='+E(S.cur.chat));
  if(!j.msgs)return;
  $('#ms').innerHTML=j.msgs.map(m=>`<div class="m ${m.from===S.me.id?'me':'th'}">${m.text||''}</div>`).join('');
}

async function snd(){
  const t=$('#inp').value.trim();if(!t)return;
  await api('/send',{chat:S.cur.chat,text:t});
  $('#inp').value='';
  loadMsgs();
}

function openDrawer(){
  $('#dr').innerHTML=`<div class="dw"><div style="padding:20px;"><h2>${S.me.name}</h2><p>@${S.me.username}</p><br><button class="btn" onclick="openDevices()">Devices (QR Scanner)</button><br><button class="btn" style="background:#e53935" onclick="localLogout()">Logout</button></div></div>`;
  $('#dr').hidden=false;
}

function openDevices(){
  $('#dr').hidden=true;
  page('Linked Devices',`
    <div style="text-align:center;padding:16px;">
      <div id="reader"></div>
      <button class="btn" onclick="startQRScan()">SCAN DESKTOP QR CODE</button>
    </div>
  `);
}

function startQRScan(){
  const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
  scanner.render(async (qid) => {
    scanner.clear();
    const res = await api('/auth/qr-approve', { qid });
    if(res.need2fa){
      const two = await ask('Enter 2-Step Password');
      if(two) await api('/auth/qr-approve', { qid, two });
    }
    toast('Device Linked Successfully!');
    $('#pg').hidden=true;
  });
}

function page(t,h){$('#pg').hidden=false;$('#pg').innerHTML=`<div class="hd badge"><button class="ib" onclick="$('#pg').hidden=true">${ic('back')}</button><b class="ttl fx">${t}</b></div><div style="padding:16px;">${h}</div>`;}
function localLogout(){S.ac.splice(S.ai,1);S.ai=0;sv();boot();}

boot();
</script>
</body>
</html>
