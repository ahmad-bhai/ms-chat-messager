<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>MS Chat</title>
<meta name="theme-color" content="#17212b" id="metaTheme">
<meta name="description" content="MS Chat - fast and secure messenger">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="512x512" href="https://ms-chat-messager.vercel.app/icon-512.png">
<link rel="apple-touch-icon" href="https://ms-chat-messager.vercel.app/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --sidebar:#17212b; --chat-bg:#0e1621; --head:#17212b; --hover:#202b36; --active:#2b5278;
  --text:#f5f5f5; --text2:#7f91a4; --accent:#6ab3f3; --btn:#2b5278; --btn-h:#3a6a99;
  --in:#182533; --out:#2b5278; --out-meta:#7da8d3; --in-meta:#6d7f8f; --tick:#7ec2ff;
  --border:#0e1621; --input:#242f3d; --badge:#3d8bd1; --danger:#ec3942; --online:#4dcd5e;
  --link:#6ab3f3; --shadow:0 8px 30px rgba(0,0,0,.45);
  --panel:#17212b; --panel-hover:#202b36;
}
[data-theme="light"]{
  --sidebar:#fff; --chat-bg:#cfe0d1; --head:#fff; --hover:#f4f4f5; --active:#3390ec;
  --text:#000; --text2:#707579; --accent:#3390ec; --btn:#3390ec; --btn-h:#2b7fd4;
  --in:#fff; --out:#eeffde; --out-meta:#4fae4e; --in-meta:#a0acb6; --tick:#4fae4e;
  --border:#dfe1e5; --input:#f4f4f5; --badge:#3390ec; --link:#168acd; --shadow:0 8px 30px rgba(0,0,0,.18);
  --panel:#fff; --panel-hover:#f4f4f5;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Nunito",Arial,sans-serif;background:var(--chat-bg);color:var(--text);overflow:hidden;font-size:15px;font-weight:500}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
svg{display:block}
img.emoji{width:22px;height:22px;vertical-align:-4px;margin:0 1px;display:inline-block;object-fit:contain}
img.emoji.sm{width:18px;height:18px;vertical-align:-3px}
img.emoji.lg{width:32px;height:32px;vertical-align:-6px}
img.emoji.big{width:56px;height:56px;vertical-align:middle}

/* Auth */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--chat-bg);z-index:50;padding:20px;overflow:auto}
[data-theme="light"] .screen{background:#fff}
.auth-card{width:100%;max-width:360px;text-align:center}
.logo{width:120px;height:120px;border-radius:50%;margin:0 auto 24px;background:linear-gradient(135deg,#37aee2,#1e96c8);display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.auth-card h1{font-size:28px;font-weight:600;margin-bottom:8px}
.sub{color:var(--text2);margin-bottom:28px;line-height:1.4}
.field{position:relative;margin-bottom:16px;text-align:left}
.field input{width:100%;height:54px;padding:20px 14px 6px;background:transparent;border:1.5px solid var(--text2);border-radius:12px;font-size:16px;outline:none;transition:border-color .15s}
[data-theme="light"] .field input{border-color:#dadce0}
.field input:focus{border-color:var(--accent)}
.field label{position:absolute;left:15px;top:16px;color:var(--text2);pointer-events:none;transition:.15s;font-size:16px}
.field input:focus+label,.field input:not(:placeholder-shown)+label{top:7px;font-size:12px}
.field input:focus+label{color:var(--accent)}
.primary{width:100%;height:50px;border-radius:12px;background:var(--btn);color:#fff;font-weight:600;font-size:15px;letter-spacing:.5px;margin-top:6px;transition:background .15s}
.primary:hover{background:var(--btn-h)}
.primary:disabled{opacity:.6}
.link{color:var(--accent);font-weight:600;font-size:13px;letter-spacing:.4px;padding:14px;width:100%}
.link.danger{color:var(--danger)}

/* Layout */
#app{display:flex;height:100vh;height:100dvh;width:100%;position:relative;overflow:hidden}
.sidebar{width:380px;max-width:42%;min-width:300px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sb-head{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;transition:background .15s}
.icon-btn:hover{background:var(--hover)}
.search{flex:1;position:relative}
.search input{width:100%;height:40px;border-radius:20px;border:2px solid transparent;background:var(--input);padding:0 14px 0 42px;outline:none;font-size:15px}
.search input:focus{border-color:var(--accent);background:transparent}
.search-ic{position:absolute;left:12px;top:9px;color:var(--text2);pointer-events:none;display:flex}
.chat-list{flex:1;overflow-y:auto;overscroll-behavior:contain}
.list-note{padding:30px 20px;text-align:center;color:var(--text2);line-height:1.5}
.list-title{padding:10px 16px 4px;color:var(--accent);font-weight:600;font-size:13px}
.ci{display:flex;gap:12px;padding:9px 12px;margin:0 6px;border-radius:10px;cursor:pointer;align-items:center;user-select:none}
.ci:hover{background:var(--hover)}
.ci.active{background:var(--active)}
.ci.active *{color:#fff!important}
.ci-body{flex:1;min-width:0}
.ci-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ci-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.ci-time{font-size:12px;color:var(--text2);flex-shrink:0}
.ci-bot{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px}
.ci-last{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ci-last.typing{color:var(--accent)}
.ci-pin{color:var(--text2);flex-shrink:0;display:flex}
.ci-mute{color:var(--text2);flex-shrink:0;display:flex}
.badge{background:var(--badge);color:#fff;font-size:12px;font-weight:600;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0}
.badge.muted{background:var(--text2)}
.ci.active .badge{background:#fff;color:var(--active)!important}
.av-wrap{position:relative;flex-shrink:0}
.av{width:54px;height:54px;border-radius:50%;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px;flex-shrink:0}
.av.sm{width:42px;height:42px;font-size:16px}
.av.lg{width:96px;height:96px;font-size:36px}
.dot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--online);border:2.5px solid var(--sidebar)}

/* Chat */
.chat-main{flex:1;min-width:0;position:relative;background:var(--chat-bg);background-size:cover;background-position:center;background-attachment:local}
.chat-main::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 20% 15%,rgba(80,120,200,.12),transparent 45%),radial-gradient(circle at 80% 85%,rgba(60,170,140,.1),transparent 45%)}
[data-theme="light"] .chat-main::before{background:radial-gradient(circle at 15% 20%,#e5efc9,transparent 50%),radial-gradient(circle at 85% 80%,#b9dbe0,transparent 50%);opacity:.9}
.empty{height:100%;display:flex;align-items:center;justify-content:center;position:relative}
.pill{background:rgba(0,0,0,.35);color:#fff;padding:5px 14px;border-radius:16px;font-size:14px}
.chat{position:absolute;inset:0;display:flex;flex-direction:column}
.chat-head{display:flex;align-items:center;gap:10px;padding:6px 12px;padding-top:max(6px,env(safe-area-inset-top));background:var(--head);border-bottom:1px solid var(--border);z-index:2;min-height:58px}
.head-info{flex:1;min-width:0;cursor:pointer}
.head-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head-status{font-size:13px;color:var(--text2);margin-top:1px}
.head-status.on{color:var(--accent)}
.head-search{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--head);border-bottom:1px solid var(--border);z-index:3}
.head-search input{flex:1;height:36px;border-radius:18px;border:none;outline:none;background:var(--input);padding:0 14px;font-size:14px}
.messages{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;position:relative;overscroll-behavior:contain;scroll-behavior:smooth}
.messages>:first-child{margin-top:auto}
.msgs-wrap{width:100%;max-width:780px;margin:0 auto;display:flex;flex-direction:column}
.date-sep{align-self:center;margin:10px 0 6px;background:rgba(0,0,0,.35);color:#fff;font-size:13px;font-weight:500;padding:3px 12px;border-radius:14px;position:sticky;top:4px;z-index:1}
.pinned-bar{display:flex;align-items:center;gap:10px;padding:6px 14px;background:var(--head);border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;z-index:2}
.pinned-bar b{color:var(--accent);font-size:12px;display:block}
.pinned-bar .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;margin:2px 0;position:relative}
.row.out{justify-content:flex-end}
.bubble{max-width:min(78%,520px);padding:6px 10px 6px;border-radius:14px;line-height:1.35;word-break:break-word;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.15);animation:pop .12s ease-out;cursor:pointer}
@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}
.row.in .bubble{background:var(--in);border-bottom-left-radius:4px}
.row.out .bubble{background:var(--out);border-bottom-right-radius:4px}
[data-theme="light"] .row.out .bubble{color:#000}
.bubble a{color:var(--link)}
.meta{float:right;margin:6px 0 -3px 10px;font-size:11.5px;color:var(--in-meta);display:inline-flex;align-items:center;gap:3px;user-select:none}
.row.out .meta{color:var(--out-meta)}
.tick{color:var(--tick);display:inline-flex}
.quote{border-left:3px solid var(--accent);background:rgba(106,179,243,.12);border-radius:4px;padding:3px 8px;margin:2px 0 5px;font-size:13.5px;cursor:pointer;overflow:hidden}
.quote b{display:block;color:var(--accent);font-size:13px}
.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.row.flash .bubble{animation:flash 1.2s}
@keyframes flash{0%,60%{filter:brightness(1.5)}100%{filter:none}}
.row.highlight .bubble{background:rgba(106,179,243,.35)}
.bubble img.photo{max-width:100%;max-height:380px;border-radius:10px;display:block;margin:2px 0;cursor:pointer;background:#000}
.bubble video{max-width:100%;max-height:380px;border-radius:10px;display:block;margin:2px 0;background:#000}
.bubble audio{width:100%;margin:4px 0;height:40px}
.bubble .emoji-big{font-size:56px;line-height:1.1;text-align:center;padding:6px 10px}
.bubble .file-row{display:flex;align-items:center;gap:10px;padding:6px 0;text-decoration:none;color:inherit}
.bubble .file-row svg{color:var(--accent);flex-shrink:0}
.bubble .file-info b{display:block;font-size:14px;word-break:break-all}
.bubble .file-info span{font-size:12px;opacity:.7}
.reactions{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.reaction{background:rgba(0,0,0,.25);border-radius:12px;padding:2px 8px;font-size:13px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.reaction.mine{background:var(--accent);color:#fff}
.reaction img.emoji{width:16px;height:16px;vertical-align:middle}

.composer-bar{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 16px;background:var(--head);border-top:1px solid var(--border);z-index:2}
.cb-ic{color:var(--accent);display:flex}
.cb-text{flex:1;min-width:0;border-left:2px solid var(--accent);padding-left:8px;font-size:13.5px}
.cb-text b{display:block;color:var(--accent)}
.cb-text span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--head);z-index:2;position:relative}
.composer textarea{flex:1;max-height:140px;min-height:44px;resize:none;border:none;outline:none;background:var(--input);border-radius:22px;padding:12px 16px;font-size:16px;line-height:1.3}
.send{width:44px;height:44px;border-radius:50%;background:var(--btn);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding-left:3px;transition:transform .1s,background .15s}
.send:active{transform:scale(.92)}
.attach-btn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0;transition:background .15s}
.attach-btn:hover{background:var(--hover)}
.recording{color:var(--danger)!important;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}

/* Upload progress */
.upload-bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:var(--sidebar);border-radius:12px;padding:8px 16px;box-shadow:var(--shadow);z-index:500;display:flex;align-items:center;gap:10px;font-size:13px;min-width:220px}
.upload-bar .bar{flex:1;height:6px;background:var(--input);border-radius:3px;overflow:hidden}
.upload-bar .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* Context menu */
.ctx{position:fixed;z-index:200;background:var(--sidebar);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:190px;animation:pop .1s ease-out}
[data-theme="dark"] .ctx{background:#1e2c3a}
.ctx button{display:flex;gap:14px;align-items:center;width:100%;padding:10px 12px;border-radius:8px;text-align:left;font-size:15px}
.ctx button:hover{background:var(--hover)}
.ctx button.danger{color:var(--danger)}
.ctx svg{color:var(--text2)}
.ctx button.danger svg{color:var(--danger)}
.ctx-sep{height:1px;background:var(--border);margin:4px 8px}
.reactions-bar{position:fixed;z-index:210;background:var(--sidebar);border-radius:24px;box-shadow:var(--shadow);padding:6px 10px;display:flex;gap:6px;animation:pop .12s ease-out;max-width:calc(100vw - 20px);overflow-x:auto}
.reactions-bar button{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .1s;flex-shrink:0}
.reactions-bar button:hover{transform:scale(1.2);background:var(--hover)}
.reactions-bar img.emoji{width:28px;height:28px}
.reaction-users{position:fixed;z-index:220;background:var(--sidebar);border-radius:14px;box-shadow:var(--shadow);padding:12px;min-width:220px;max-height:60vh;overflow-y:auto}
.reaction-users h4{font-size:14px;margin-bottom:8px;color:var(--text2)}
.reaction-users .ru-item{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer}
.reaction-users .ru-item:hover{background:var(--hover)}
.reaction-users .ru-item .av{width:32px;height:32px;font-size:14px}

/* Side Panel */
.side-panel{position:fixed;top:0;left:0;bottom:0;width:320px;max-width:85vw;background:var(--panel);z-index:180;transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.side-panel.open{transform:none}
.sp-head{padding:16px;padding-top:max(16px,env(safe-area-inset-top));background:linear-gradient(135deg,#37aee2,#1e96c8);color:#fff;display:flex;flex-direction:column;gap:10px}
.sp-acc{display:flex;align-items:center;gap:12px;cursor:pointer}
.sp-acc .av{width:56px;height:56px;font-size:20px;border:2px solid rgba(255,255,255,.5)}
.sp-acc-info{flex:1;min-width:0}
.sp-acc-name{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-acc-user{font-size:13px;opacity:.85}
.sp-list{flex:1;overflow-y:auto;padding:6px 0}
.sp-item{display:flex;gap:16px;align-items:center;padding:12px 16px;cursor:pointer;color:var(--text);font-size:15px}
.sp-item:hover{background:var(--panel-hover)}
.sp-item svg{color:var(--text2);flex-shrink:0}
.sp-sep{height:1px;background:var(--border);margin:6px 16px}
.sp-acc-sub{font-size:13px;padding:8px 16px;color:var(--text2);display:flex;align-items:center;gap:8px}
.sp-acc-sub:hover{background:var(--panel-hover);cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:170;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:auto}

/* Modal/Sheet */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--sidebar);width:100%;max-width:460px;max-height:92vh;max-height:92dvh;border-radius:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.sheet-head h3{flex:1;font-size:18px}
.text-btn{color:var(--accent);font-weight:600;padding:8px 12px}
.sheet-body{padding:6px 18px 18px;overflow-y:auto}
.profile-pic{display:flex;flex-direction:column;align-items:center;margin-bottom:12px}
.pp{margin-bottom:4px;cursor:pointer}
.row-switch{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;gap:8px}
.sw{position:relative;width:42px;height:24px;display:inline-block;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:#556;border-radius:12px;transition:.2s;cursor:pointer}
.sw i::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.row-btn{display:flex;gap:16px;align-items:center;width:100%;padding:13px 2px;font-size:15px;text-align:left;border-radius:8px}
.row-btn:hover{background:var(--hover)}
.row-btn svg{color:var(--text2);flex-shrink:0}
.row-btn.danger,.row-btn.danger svg{color:var(--danger)}
.hint{color:var(--text2);font-size:13px;line-height:1.5;padding:6px 2px}
.select-input{background:var(--input);color:var(--text);border:none;padding:6px 10px;border-radius:8px;font-size:14px}
.slider{width:140px}
.divider{height:1px;background:var(--border);margin:14px 0}

#toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:rgba(20,20,20,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* Emoji picker */
.emoji-picker{position:absolute;bottom:70px;right:16px;width:320px;max-width:calc(100vw - 32px);height:380px;background:var(--sidebar);border-radius:14px;box-shadow:var(--shadow);z-index:120;display:flex;flex-direction:column;overflow:hidden;animation:pop .15s ease-out}
.ep-head{padding:8px;border-bottom:1px solid var(--border);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.ep-head::-webkit-scrollbar{display:none}
.ep-head button{padding:4px 8px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ep-head button:hover,.ep-head button.active{background:var(--hover)}
.ep-body{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px;align-content:start}
.ep-body button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px}
.ep-body button:hover{background:var(--hover)}
.ep-body img.emoji{width:28px;height:28px}

/* Attach menu */
.attach-menu{position:absolute;bottom:70px;left:16px;background:var(--sidebar);border-radius:12px;box-shadow:var(--shadow);z-index:120;padding:6px;animation:pop .15s ease-out}
.attach-menu button{display:flex;gap:14px;align-items:center;padding:10px 16px;border-radius:8px;width:100%;font-size:15px;white-space:nowrap}
.attach-menu button:hover{background:var(--hover)}
.attach-menu svg{color:var(--accent)}

/* Wallpaper picker */
.wp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.wp-item{aspect-ratio:9/16;border-radius:10px;background-size:cover;background-position:center;cursor:pointer;border:2px solid transparent;transition:border-color .15s;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:12px;background-color:var(--input)}
.wp-item:hover,.wp-item.active{border-color:var(--accent)}

/* Profile */
.profile-hero{display:flex;flex-direction:column;align-items:center;padding:16px 0 12px;gap:6px}
.profile-hero .av{width:110px;height:110px;font-size:40px;cursor:pointer}
.profile-hero .name{font-size:22px;font-weight:600}
.profile-hero .uname{color:var(--accent);font-size:15px}
.profile-rows{background:var(--input);border-radius:12px;margin-top:12px;overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow .label{color:var(--text2);font-size:13px;width:90px;flex-shrink:0}
.prow .val{flex:1;word-break:break-all;font-size:14px}
.prow .val a{color:var(--accent);text-decoration:none}

/* Voice recording */
.rec-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
.rec-overlay .rec-time-big{font-size:36px;font-weight:600}
.rec-overlay .rec-wave{width:80%;max-width:400px;height:60px;display:flex;align-items:center;justify-content:center;gap:2px}
.rec-overlay .rec-wave span{width:3px;background:var(--accent);border-radius:2px;animation:wave 1s infinite ease-in-out;height:20%}
@keyframes wave{0%,100%{height:10%}50%{height:100%}}
.rec-btns{display:flex;gap:20px;margin-top:20px}
.rec-btns button{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);color:#fff;transition:background .15s}
.rec-btns button.rec-send{background:var(--accent)}
.rec-btns button.rec-del{background:var(--danger)}

/* In-app link viewer */
.link-viewer{position:fixed;inset:0;background:var(--chat-bg);z-index:500;display:flex;flex-direction:column}
.link-viewer header{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--head);border-bottom:1px solid var(--border)}
.link-viewer header .url{flex:1;min-width:0;font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-viewer iframe{flex:1;width:100%;border:none;background:#fff}

/* Mobile */
.only-mobile{display:none}
@media (max-width:760px){
  .sidebar{width:100%;max-width:100%;border-right:none}
  .chat-main{position:absolute;inset:0;transform:translateX(100%);transition:transform .25s ease;z-index:10}
  #app.chat-open .chat-main{transform:none}
  .empty{display:none}
  .only-mobile{display:flex}
  .bubble{max-width:86%}
  .modal{padding:0;align-items:flex-end}
  .sheet{max-width:100%;border-radius:16px 16px 0 0}
  .emoji-picker{width:calc(100vw - 24px);right:12px;left:12px;max-width:none}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(127,145,164,.35);border-radius:3px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="screen">
  <div class="auth-card">
    <div class="logo"><img src="https://web.telegram.org/a/img-apple-64/1f4ac.png" alt="MS Chat"></div>
    <h1 id="authTitle">MS Chat</h1>
    <p id="authSub" class="sub">Please enter your email to continue.</p>
    <form id="authForm" novalidate>
      <div class="field" id="fEmail"><input type="email" id="email" placeholder=" " autocomplete="email" inputmode="email"><label for="email">Email</label></div>
      <div class="field hidden" id="fPass"><input type="password" id="password" placeholder=" " autocomplete="current-password"><label for="password">Password</label></div>
      <div class="field hidden" id="fPin"><input type="password" id="twoStepPin" placeholder=" " autocomplete="off"><label for="twoStepPin">Two-Step PIN</label></div>
      <div id="fReg" class="hidden">
        <div class="field"><input type="text" id="firstName" placeholder=" " autocomplete="given-name" maxlength="40"><label for="firstName">First name</label></div>
        <div class="field"><input type="text" id="username" placeholder=" " autocomplete="username" maxlength="21" autocapitalize="none"><label for="username">Username</label></div>
      </div>
      <button type="submit" class="primary" id="authBtn">NEXT</button>
      <button type="button" class="link hidden" id="authForgot">FORGOT PASSWORD?</button>
      <button type="button" class="link hidden" id="authBack">BACK</button>
    </form>
    <button type="button" class="link hidden" id="installAuth">INSTALL APP</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="sb-head">
      <button class="icon-btn" id="menuBtn" aria-label="Menu"></button>
      <div class="search"><span class="search-ic" id="searchIc"></span><input type="text" id="searchInput" placeholder="Search" autocomplete="off"></div>
    </div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="chat-main" id="chatMain">
    <div class="empty" id="emptyState"><span class="pill">Select a chat to start messaging</span></div>
    <section class="chat hidden" id="chatView">
      <header class="chat-head">
        <button class="icon-btn only-mobile" id="backBtn" aria-label="Back"></button>
        <div id="headAvatar"></div>
        <div class="head-info" id="headInfo"><div class="head-name" id="headName"></div><div class="head-status" id="headStatus"></div></div>
        <button class="icon-btn" id="headSearchBtn" aria-label="Search"></button>
        <button class="icon-btn" id="chatMenuBtn" aria-label="Menu"></button>
      </header>
      <div class="head-search hidden" id="headSearch">
        <input type="text" id="msgSearchInput" placeholder="Search messages...">
        <button class="icon-btn" id="msgSearchClose"></button>
      </div>
      <div id="pinnedHost"></div>
      <div class="messages" id="messages"></div>
      <div class="composer-bar hidden" id="composerBar">
        <span class="cb-ic" id="cbIcon"></span>
        <div class="cb-text"><b id="cbTitle"></b><span id="cbBody"></span></div>
        <button class="icon-btn" id="cbClose" aria-label="Cancel"></button>
      </div>
      <footer class="composer">
        <button class="attach-btn" id="attachBtn" aria-label="Attach"></button>
        <textarea id="msgInput" rows="1" placeholder="Message" maxlength="4000"></textarea>
        <button class="attach-btn" id="emojiBtn" aria-label="Emoji"></button>
        <button class="attach-btn" id="micBtn" aria-label="Record voice"></button>
        <button class="send hidden" id="sendBtn" aria-label="Send"></button>
      </footer>
      <div id="attachHost"></div>
      <div id="emojiHost"></div>
    </section>
  </main>
</div>

<!-- SIDE PANEL -->
<div class="overlay" id="spOverlay"></div>
<div class="side-panel" id="sidePanel">
  <div class="sp-head">
    <div class="sp-acc" id="spAccount">
      <div id="spAvatar"></div>
      <div class="sp-acc-info">
        <div class="sp-acc-name" id="spName">Account</div>
        <div class="sp-acc-user" id="spUser">@username</div>
      </div>
    </div>
  </div>
  <div class="sp-list" id="spList"></div>
</div>

<!-- MODAL HOST -->
<div id="modalHost"></div>
<div id="ctx" class="ctx hidden"></div>
<div id="toast"></div>

const COLORS=['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae'];
const colorOf = id => { let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return COLORS[h%COLORS.length]; };

function fmtListTime(ts){if(!ts)return'';const d=new Date(ts),now=Date.now();if(sameDay(ts,now))return fmtTime(ts);if(now-ts<6*864e5)return d.toLocaleDateString([],{weekday:'short'});return d.toLocaleDateString([],{day:'numeric',month:'short'});}
function dayLabel(ts){if(sameDay(ts,Date.now()))return'Today';if(sameDay(ts,Date.now()-864e5))return'Yesterday';return new Date(ts).toLocaleDateString([],{day:'numeric',month:'long',year:new Date(ts).getFullYear()===new Date().getFullYear()?undefined:'numeric'});}

/* ===== EMOJI ===== */
function emojiToCode(ch){
  const cps=[];
  for(const ch2 of ch){cps.push(ch2.codePointAt(0).toString(16));}
  return cps.join('-');
}
function hasEmoji(str){return /\p{Extended_Pictographic}/u.test(str);}
function countEmoji(str){const m = str.match(/\p{Extended_Pictographic}(\u200d\p{Extended_Pictographic})*/gu);return m?m.length:0;}
function isOnlyEmoji(str){
  const trimmed = str.trim();
  if(!trimmed) return false;
  // Must contain only emoji + whitespace, up to 3
  const onlyEmojiRegex = /^[\p{Extended_Pictographic}\u200d\uFE0F\s]+$/u;
  if(!onlyEmojiRegex.test(trimmed)) return false;
  return countEmoji(trimmed) <= 3;
}
const TELEGRAM_EMOJI_BASE = 'https://web.telegram.org/a/img-apple-64/';
function emojiImg(code, cls=''){return `<img class="emoji ${cls}" src="${TELEGRAM_EMOJI_BASE}${code}.png" alt="" loading="lazy">`;}

/* FIX: proper HTML escaping BEFORE replacing emojis so no raw HTML escapes */
function renderEmojiText(text){
  if(!hasEmoji(text)) return esc(text);
  const out = [];
  const re = /\p{Extended_Pictographic}(\u200d\p{Extended_Pictographic})*[\u{FE0F}\u{FE0E}]?/gu;
  let last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) out.push(esc(text.slice(last, m.index)));
    const code = emojiToCode(m[0].replace(/[\u{FE0F}\u{FE0E}]/gu,''));
    out.push(emojiImg(code));
    last = m.index + m[0].length;
  }
  if(last < text.length) out.push(esc(text.slice(last)));
  return out.join('');
}
/* Replace @username and /username and https:// links with clickable elements.
   In-app links get data-inapp attr so we open them inside viewer. */
function linkify(html){
  // Username mention: @word  (word=3-20 letters/digits/_)
  html = html.replace(/(^|[^a-zA-Z0-9_@\/])@([a-z0-9_]{3,20})/gi, (m, pre, name) =>
    `${pre}<a class="ms-link" href="#" data-mention="${esc(name)}">@${esc(name)}</a>`);
  // /username (our app link)
  html = html.replace(/(^|[^a-zA-Z0-9_@])@?\/([a-z0-9_]{3,20})(?![a-zA-Z0-9_\/])/gi, (m, pre, name) =>
    `${pre}<a class="ms-link" href="#" data-mention="${esc(name)}">/${esc(name)}</a>`);
  // Full URL
  html = html.replace(/(https?:\/\/[^\s<>"']+)/g, u => 
    `<a class="ms-link" href="#" data-url="${esc(u)}">${esc(u)}</a>`);
  return html;
}
function fmtText(t){
  const bigEmoji = isOnlyEmoji(t);
  const inner = linkify(renderEmojiText(t)).replace(/\n/g,'<br>');
  return bigEmoji ? `<div class="emoji-big">${inner}</div>` : inner;
}

/* ===== API ===== */
async function api(path, opts={}){
  let res, data={};
  try{
    res = await fetch('/api'+path, {
      method: opts.method||'GET',
      headers: {'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{})},
      body: opts.body?JSON.stringify(opts.body):undefined
    });
    const txt = await res.text();
    try { data = JSON.parse(txt); } catch(e) { data = { success:false, message: 'Server error: ' + txt.slice(0,120) }; }
    if(res.status===401 && token && !opts.noLogout){ doLogout(true); return {success:false,message:'Session expired'}; }
    if(!res.ok && !Array.isArray(data)) data.success=false;
  }catch(e){
    return {success:false,message:'No connection to server'};
  }
  return data;
}

let step='email', savedEmail='';
function showStep(s){
  step=s;
  const show = ids => ['fEmail','fPass','fPin','fReg'].forEach(id=>$('#'+id).classList.toggle('hidden',!ids.includes(id)));
  const T=$('#authTitle'), S=$('#authSub'), B=$('#authBtn');
  $('#authBack').classList.toggle('hidden', s==='email');
  $('#authForgot').classList.toggle('hidden', s!=='login');
  if(s==='email'){show(['fEmail']);T.textContent='MS Chat';S.textContent='Please enter your email to continue.';B.textContent='NEXT';}
  if(s==='login'){show(['fPass']);T.textContent='Welcome back';S.textContent=savedEmail;B.textContent='SIGN IN';$('#password').setAttribute('autocomplete','current-password');$('#password').focus();}
  if(s==='register'){show(['fPass','fReg']);T.textContent='Create your profile';S.textContent=savedEmail+' — choose a password (min 6) and username.';B.textContent='SIGN UP';$('#password').setAttribute('autocomplete','new-password');$('#firstName').focus();}
  if(s==='pin'){show(['fPin']);T.textContent='Two-Step Verification';S.textContent='Your account is protected with an extra PIN.';B.textContent='CONTINUE';$('#twoStepPin').focus();}
  if(s==='forgot'){show([]);T.textContent='Reset password';S.textContent='We will email you a reset code.';B.textContent='SEND RESET';}
}
$('#authBack').onclick = ()=>{$('#password').value='';$('#twoStepPin').value='';showStep('email');};
$('#authForgot').onclick = ()=> showStep('forgot');
$('#authForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn=$('#authBtn'); if(btn.disabled) return; btn.disabled=true;
  try{
    const password=$('#password').value;
    if(step==='email'){
      const email=$('#email').value.trim().toLowerCase();
      const r=await api('/auth/check-email',{method:'POST',body:{email},noLogout:true});
      if(!r.success) return toast(r.message||'Error');
      savedEmail=email; showStep(r.exists?'login':'register');
    } else if(step==='login'||step==='pin'){
      const body={email:savedEmail,password};
      if(step==='pin') body.twoStepPin=$('#twoStepPin').value;
      const r=await api('/auth/login',{method:'POST',body,noLogout:true});
      if(r.requiresTwoStep) return showStep('pin');
      if(!r.success) return toast(r.message||'Login failed');
      finishAuth(r);
    } else if(step==='register'){
      const r=await api('/auth/register',{method:'POST',noLogout:true,body:{email:savedEmail,password,firstName:$('#firstName').value,username:$('#username').value}});
      if(!r.success) return toast(r.message||'Registration failed');
      finishAuth(r);
    } else if(step==='forgot'){
      const email = savedEmail || $('#email').value.trim().toLowerCase();
      const r = await api('/auth/forgot',{method:'POST',body:{email},noLogout:true});
      toast(r.message || 'Reset email sent (check inbox)');
      showStep('email');
    }
  } finally { btn.disabled=false; }
});
function finishAuth(r){
  token=r.token; localStorage.setItem('ms_token',token);
  me=r.user;
  const exists = accounts.find(a=>a.userId===me.id);
  if(!exists){
    accounts.push({token, email:r.user.email||'', userId:me.id, firstName:me.firstName, username:me.username, profilePhoto:me.profilePhoto||''});
    if(accounts.length>5) accounts = accounts.slice(-5);
  } else { exists.token = token; exists.profilePhoto = me.profilePhoto; }
  saveAccounts();
  start();
}

  else showStep('email');
}

/* ===== REALTIME ===== */
function connectEvents(){ver=null;lastHb=0;lastFull=Date.now();poll();}
function schedulePoll(){
  clearTimeout(pollTimer);
  if(!token) return;
  pollTimer = setTimeout(poll, document.hidden?15000:activeId?2500:6000);
}
async function poll(){
  if(!token||polling) return;
  polling=true;
  try{
    const hb = Date.now()-lastHb>20000;
    let q='/sync?v='+(ver===null?'':ver)+(hb?'&hb=1':'');
    const c=activeChat();
    if(c) q+='&chat='+c.id+'&peer='+c.user.id;
    const r=await api(q);
    if(r.success){
      if(hb) lastHb=Date.now();
      showTyping(!!r.typing);
      const changed = ver!==null && r.ver!==ver;
      ver=r.ver;
      if(changed || Date.now()-lastFull>60000) await refresh();
    }
  } catch(e){} finally { polling=false; schedulePoll(); }
}
function showTyping(on){
  const id=activeId; if(!id) return;
  const was=!!typingTimers[id];
  clearTimeout(typingTimers[id]);
  if(on) typingTimers[id]=setTimeout(()=>{delete typingTimers[id];updateHeader();renderChats();},4000);
  else delete typingTimers[id];
  if(was!==on){updateHeader();renderChats();}
}
async function refresh(){
  lastFull=Date.now();
  const prev = new Map(chats.map(c=>[c.id, c.last && c.last.id]));
  await loadChats();
  for(const c of chats){
    const l=c.last;
    if(l && l.senderId!==me.id && prev.get(c.id)!==l.id && (document.hidden||c.id!==activeId)) notifyNewMessage({...l, chatId:c.id});
  }
  if(activeId) await loadMessages();
}
function notifyNewMessage(m){
  const c = chats.find(x=>x.id===m.chatId);
  const name = c?c.user.firstName:'New message';
  playNotifSound();
  if(settings.notif && window.Notification && Notification.permission==='granted'){
    const n = new Notification(name, {body:(m.text||'').slice(0,120), icon:'https://web.telegram.org/a/img-apple-64/1f4ac.png', tag:m.chatId});
    n.onclick = ()=>{window.focus(); openChat(m.chatId);};
  } else if(m.chatId!==activeId){
    toast(name+': '+(m.text||'').slice(0,50));
  }
}

/* ===== OPEN CHAT ===== */
async function openChat(id){
  const wasOpen=!!activeId;
  activeId=id; clearComposer();
  $('#emptyState').classList.add('hidden');
  $('#chatView').classList.remove('hidden');
  $('#app').classList.add('chat-open');
  $('#headSearch').classList.add('hidden');
  if(isMobile()&&!wasOpen) history.pushState({chat:true},'');
  updateHeader(); renderChats();
  $('#messages').innerHTML=''; msgs=[];
  if(msgCache[id]){ msgs=msgCache[id]; renderMessages(true,true); }
  await loadMessages(true);
  if(!isMobile()) $('#msgInput').focus();
}
function closeChat(){
  activeId=null; msgs=[];
  $('#app').classList.remove('chat-open');
  $('#chatView').classList.add('hidden');
  $('#emptyState').classList.remove('hidden');
  renderChats();
}
$('#backBtn').onclick=()=>{if(history.state&&history.state.chat)history.back();else closeChat();};
window.addEventListener('popstate',()=>{if(activeId)closeChat();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    hideCtx(); hideReactionsBar();
    if(composer.mode) clearComposer();
    else if(!$('#headSearch').classList.contains('hidden')) $('#headSearch').classList.add('hidden');
    else if($('#sidePanel').classList.contains('open')) closeSidePanel();
    else if(activeId && !isMobile()) closeChat();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(pollTimer);poll();if(activeId)loadMessages();}});

function activeChat(){return chats.find(c=>c.id===activeId);}
function updateHeader(){
  const c=activeChat(); if(!c) return;
  const u = displayUserFor(c);
  $('#headAvatar').innerHTML=avatar(u,'sm');
  $('#headName').innerHTML=fmtText(u.firstName);
  const st=$('#headStatus');
  if(typingTimers[c.id]){st.textContent='typing…';st.className='head-status on';}
  else{st.textContent=lastSeenText(u);st.className='head-status'+(u.online?' on':'');}
}
async function loadMessages(instant){
  if(!activeId) return;
  const id=activeId;
  const r=await api('/messages/'+id);
  if(id!==activeId||!Array.isArray(r)) return;
  const changed = JSON.stringify(r)!==JSON.stringify(msgs);
  msgs=r; msgCache[id]=r;
  if(changed||instant) renderMessages(true,!!instant);
  renderPinnedBar();
  const unreadIn = msgs.some(m=>m.senderId!==me.id&&!m.read);
  if(unreadIn&&!document.hidden) markRead();
}
let markingRead=false;
async function markRead(){
  if(!activeId||markingRead) return;
  markingRead=true;
  const id=activeId;
  try{
    const r=await api('/chats/'+id+'/read',{method:'POST'});
    if(r.success&&id===activeId) msgs.forEach(m=>{if(m.senderId!==me.id)m.read=true;});
  } finally {markingRead=false;}
  const c=activeChat();
  if(c&&c.unread){c.unread=0;renderChats();}
}

function renderPinnedBar(){
  const host = $('#pinnedHost');
  const pinned = msgs.filter(m=>m.pinned);
  if(!pinned.length){host.innerHTML='';return;}
  const p = pinned[0];
  const senderName = p.senderId===me.id?'You':(activeChat()?activeChat().user.firstName:'');
  host.innerHTML = `<div class="pinned-bar" data-goto="${esc(p.id)}">${ic('pin',18)}
    <div class="txt"><b>Pinned message · ${pinned.length>1?pinned.length+' messages':''}</b>${esc(senderName)}: ${esc((p.text||'[media]').slice(0,80))}</div>
  </div>`;
  host.querySelector('.pinned-bar').onclick = ()=>{ jumpToMessage(p.id); };
}

/* ===== RENDER MESSAGES ===== */
function renderMessages(scroll, instant){
  const area=$('#messages');
  const nearBottom = area.scrollHeight-area.scrollTop-area.clientHeight<140;
  let html='', lastDay=null;
  for(const m of msgs){
    if(!lastDay||!sameDay(lastDay,m.time)){html+=`<div class="date-sep">${esc(dayLabel(m.time))}</div>`;lastDay=m.time;}
    const out = m.senderId===me.id;
    const q = m.replyTo ? (m.replyTo.deleted
      ? `<div class="quote"><b>Deleted message</b><span>—</span></div>`
      : `<div class="quote" data-goto="${esc(m.replyTo.id)}"><b>${m.replyTo.senderId===me.id?'You':esc((activeChat()||{user:{firstName:''}}).user.firstName)}</b><span>${esc(m.replyTo.text)}</span></div>`):'';
    const tick = out?`<span class="tick">${ic(m.read?'checks':'check',16)}</span>`:'';
    const reactions = m.reactions && Object.keys(m.reactions).length
      ? `<div class="reactions">${Object.entries(m.reactions).map(([emoji,users])=>
          `<span class="reaction ${users.includes(me.id)?'mine':''}" data-emoji="${esc(emoji)}" data-msg="${esc(m.id)}">${emojiImg(emojiToCode(emoji))} ${users.length}</span>`).join('')}</div>`
      : '';
    let body;
    if(m.type==='image'){ body=`<img class="photo" src="${esc(m.mediaUrl)}" alt="" data-photo>`+(m.text?`<div>${fmtText(m.text)}</div>`:''); }
    else if(m.type==='video'){ body=`<video src="${esc(m.mediaUrl)}" controls preload="metadata"></video>`+(m.text?`<div>${fmtText(m.text)}</div>`:''); }
    else if(m.type==='audio'){ body=`<audio src="${esc(m.mediaUrl)}" controls></audio>`; }
    else if(m.type==='file'){ body=`<a class="file-row" href="${esc(m.mediaUrl)}" download="${esc(m.fileName||'file')}" target="_blank" rel="noopener">${ic('file',28)}<div class="file-info"><b>${esc(m.fileName||'File')}</b><span>Click to download</span></div></a>`+(m.text?`<div>${fmtText(m.text)}</div>`:''); }
    else { body=`<span class="txt">${fmtText(m.text)}</span>`; }
    const pinMark = m.pinned?`<span style="position:absolute;top:4px;right:8px;color:var(--accent);opacity:.6">${ic('pin',14)}</span>`:'';
    html+=`<div class="row ${out?'out':'in'}" data-id="${esc(m.id)}"><div class="bubble">${pinMark}${q}${body}${reactions}<span class="meta">${m.edited?'edited ':''}${fmtTime(m.time)}${tick}</span></div></div>`;
  }
  area.innerHTML=`<div class="msgs-wrap">${html}</div>`;
  const mine = msgs.length && msgs[msgs.length-1].senderId===me.id;
  if(scroll && (instant || nearBottom || mine)){
    area.style.scrollBehavior = instant?'auto':'smooth';
    area.scrollTop=area.scrollHeight;
    requestAnimationFrame(()=>{area.scrollTop=area.scrollHeight;});
  }
}
function jumpToMessage(id){
  const row = $(`.row[data-id="${CSS.escape(id)}"]`);
  if(row){ row.scrollIntoView({block:'center',behavior:'smooth'}); row.classList.add('highlight'); setTimeout(()=>row.classList.remove('highlight'),1500); }
}

/* ===== CONTEXT MENU ===== */
const ctx = $('#ctx');
function hideCtx(){ctx.classList.add('hidden');}
function showCtx(msg, x, y){
  const own = msg.senderId===me.id;
  ctx.innerHTML =
    `<button data-a="reply">${ic('reply',20)}Reply</button>`+

    `<button data-a="pin">${ic('pin',20)}${msg.pinned?'Unpin':'Pin'}</button>`+
    `<div class="ctx-sep"></div>`+
    `<button data-a="delete" class="danger">${ic('trash',20)}Delete</button>`;
  ctx.dataset.id=msg.id;
  ctx.classList.remove('hidden');
  const w=ctx.offsetWidth,h=ctx.offsetHeight;
  ctx.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+'px';
  ctx.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+'px';
}
function showChatMenu(c, x, y){
  hideCtx();
  const isPinned = pinnedChats.includes(c.id);
  const isMuted = mutedSet.has(c.user.id);
  ctx.innerHTML =
    `<button data-a="open-profile">${ic('person',20)}View profile</button>`+
    `<button data-a="pin-chat">${ic('pin',20)}${isPinned?'Unpin chat':'Pin chat'}</button>`+
    `<button data-a="mute-chat">${ic(isMuted?'unmute':'mute',20)}${isMuted?'Unmute':'Mute'}</button>`+
    `<button data-a="select-msgs">${ic('select',20)}Select messages</button>`+
    `<div class="ctx-sep"></div>`+
    `<button data-a="goto-first">${ic('first',20)}Go to first message</button>`+
    `<button data-a="clear-chat" class="danger">${ic('trash',20)}Clear history</button>`+
    `<button data-a="delete-chat" class="danger">${ic('trash',20)}Delete chat</button>`;
  ctx.dataset.chat = c.id;
  ctx.dataset.user = c.user.id;
  ctx.classList.remove('hidden');
  const w=ctx.offsetWidth,h=ctx.offsetHeight;
  ctx.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+'px';
  ctx.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+'px';
}
ctx.addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const a=b.dataset.a;
  const msgId = ctx.dataset.id;
  const chatId = ctx.dataset.chat;
  const userId = ctx.dataset.user;
  // message-level
  if(msgId){
    const m=msgs.find(x=>x.id===msgId); hideCtx(); if(!m) return;
    if(a==='reply') setComposer('reply',m);
    if(a==='react') showReactionsBar(m);
    if(a==='copy'){try{await navigator.clipboard.writeText(m.text);toast('Copied');}catch(e){toast('Copy not allowed');}}
    if(a==='edit'){setComposer('edit',m);$('#msgInput').value=m.text;resizeInput();}
    if(a==='pin'){
      const r=await api('/messages/'+m.id+'/pin',{method:'POST',body:{pinned:!m.pinned}});
      if(r.success){m.pinned=!m.pinned;toast(m.pinned?'Pinned':'Unpinned');renderMessages(false);renderPinnedBar();}
    }
    if(a==='forward'){ showForwardPicker(m); }
    if(a==='delete'){
      if(!confirm('Delete this message for everyone?')) return;
      const r=await api('/messages/'+m.id,{method:'DELETE'});
      if(!r.success) toast(r.message||'Failed');
      else { msgs=msgs.filter(x=>x.id!==m.id); renderMessages(false); renderPinnedBar(); loadChats(); }
    }
    return;
  }
  // chat-level
  if(chatId){
    hideCtx();
    if(a==='pin-chat'){
      const i = pinnedChats.indexOf(chatId);
      if(i>-1) pinnedChats.splice(i,1); else pinnedChats.push(chatId);
      savePinnedChats(); renderChats(); return;
    }
    if(a==='mute-chat'){
      const i = muted.indexOf(userId);
      if(i>-1) muted.splice(i,1); else muted.push(userId);
      saveMuted(); renderChats(); return;
    }
    if(a==='select-msgs'){ toast('Long-press any message to select'); return; }
    if(a==='open-profile'){
      const c = chats.find(x=>x.id===chatId); if(c) openProfileModal(c.user, false);
      return;
    }
    if(a==='goto-first'){ if(msgs[0]) jumpToMessage(msgs[0].id); return; }
    if(a==='clear-chat'||a==='delete-chat'){
      const c = chats.find(x=>x.id===chatId); if(!c) return;
      const both = confirm('OK = delete for both sides · Cancel = only for me');
      if(a==='clear-chat'){
        if(both){ await api('/chats/clear/'+chatId,{method:'DELETE'}); }
        else { msgCache[chatId]=[]; if(chatId===activeId){msgs=[];renderMessages(false);renderPinnedBar();} }
        toast('History cleared');
      } else {
        if(both){ await api('/chats/clear/'+chatId,{method:'DELETE'}); }
        chats = chats.filter(x=>x.id!==chatId);
        if(chatId===activeId) closeChat();
        renderChats();
      }
      return;
    }
  }
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#ctx')&&!e.target.closest('.reactions-bar')&&!e.target.closest('.reaction-users')){hideCtx();}});
$('#messages').addEventListener('contextmenu',e=>{

  e.preventDefault();
  const m=msgs.find(x=>x.id===row.dataset.id);
  if(m) showCtx(m,e.clientX,e.clientY);
});
/* In-app link + mention click */
$('#messages').addEventListener('click', e=>{
  const mention = e.target.closest('[data-mention]');
  if(mention){ e.preventDefault(); openByUsername(mention.dataset.mention); return; }
  const urlEl = e.target.closest('[data-url]');
  if(urlEl){ e.preventDefault(); openInAppViewer(urlEl.dataset.url); return; }
  if(e.target.closest('a[href^="http"]')){ e.preventDefault(); openInAppViewer(e.target.getAttribute('href')); return; }
  const qt=e.target.closest('.quote[data-goto]');
  if(qt){ jumpToMessage(qt.dataset.goto); return; }
  const img = e.target.closest('img[data-photo]');
  if(img){ openPhotoViewer(img.src); return; }
  const reactEl = e.target.closest('.reaction[data-emoji]');
  if(reactEl){ e.stopPropagation(); showReactionUsers(reactEl.dataset.msg, reactEl.dataset.emoji, e.clientX, e.clientY); return; }
  const bub=e.target.closest('.bubble'); if(!bub) return;
  const row = bub.closest('.row');
  const m = msgs.find(x=>x.id===row.dataset.id); if(!m) return;
  const now = Date.now();
  if(lastTapId===m.id && now-lastTap < 350){
    quickReact(m, settings.doubleTapReaction);
    lastTap = 0; lastTapId = null;
    return;
  }
  lastTap = now; lastTapId = m.id;
  setTimeout(()=>{
    if(lastTapId===m.id && Date.now()-lastTap>=340 && window.matchMedia('(pointer:coarse)').matches){
      const r = bub.getBoundingClientRect();
      showCtx(m, row.classList.contains('out') ? r.right-190 : r.left, r.bottom+4);
    }
  }, 360);
});
let lastTap = 0, lastTapId = null;

async function openByUsername(username){
  const r = await api('/users/search?q='+encodeURIComponent(username));
  if(Array.isArray(r) && r.length){
    const u = r.find(x=>x.username.toLowerCase()===username.toLowerCase()) || r[0];
    const cr = await api('/chats/create',{method:'POST',body:{targetUserId:u.id}});
    if(cr.success){ if(!chats.some(c=>c.id===cr.chat.id)) chats.unshift(cr.chat); renderChats(); openChat(cr.chat.id); }
  } else toast('User not found');
}

async function quickReact(m, emoji){
  const code = emojiToCode(emoji);
  const r = await api('/messages/'+m.id+'/react',{method:'POST',body:{emoji, code}});
  if(r.success){
    m.reactions = m.reactions || {};
    const arr = m.reactions[emoji] = m.reactions[emoji] || [];
    const i = arr.indexOf(me.id);
    if(i>-1) arr.splice(i,1); else arr.push(me.id);
    if(!arr.length) delete m.reactions[emoji];
    renderMessages(false);
  }
}

/* Show users who reacted with a specific emoji */
function showReactionUsers(msgId, emoji, x, y){
  const m = msgs.find(x=>x.id===msgId);
  if(!m||!m.reactions||!m.reactions[emoji]) return;
  const userIds = m.reactions[emoji];
  const host = $('#modalHost'); host.innerHTML='';
  const el = document.createElement('div');
  el.className='reaction-users';
  el.style.left = Math.max(8, Math.min(x, innerWidth-240))+'px';
  el.style.top = Math.max(8, Math.min(y, innerHeight-220))+'px';
  el.innerHTML = `<h4>${emojiImg(emojiToCode(emoji),'sm')} ${userIds.length} reaction${userIds.length>1?'s':''}</h4>`+
    userIds.map(uid => {
      const isMe = uid===me.id;
      const u = isMe ? me : {id:uid, firstName:'User', profilePhoto:'', username:''};
      return `<div class="ru-item" data-uid="${esc(uid)}">${avatar(u,'')}<div><b>${fmtText(u.firstName)}</b>${isMe?' (You)':''}</div></div>`;
    }).join('');
  document.body.appendChild(el);
  const close = ev => { if(!el.contains(ev.target)){ el.remove(); document.removeEventListener('pointerdown',close); } };
  setTimeout(()=>document.addEventListener('pointerdown',close),50);
  el.addEventListener('click', ev=>{
    const it = ev.target.closest('.ru-item'); if(!it) return;
    const uid = it.dataset.uid;
    el.remove();
    if(uid===me.id){ openProfileModal(me, true); return; }
    // try to find user in chats
    for(const c of chats){
      if(c.user.id===uid){ openProfileModal(c.user, false); return; }
    }
    api('/users/search?q='+uid).then(r=>{
      if(Array.isArray(r) && r.length) openProfileModal(r[0], false);
    });
  });
}

/* ===== COMPOSER ===== */
function setComposer(mode,msg){
  composer={mode,msg};
  $('#composerBar').classList.remove('hidden');
  $('#cbIcon').innerHTML=ic(mode==='edit'?'edit':'reply',22);
  $('#cbTitle').textContent=mode==='edit'?'Edit message':'Reply to '+(msg.senderId===me.id?'yourself':(activeChat()?activeChat().user.firstName:''));
  $('#cbBody').textContent=(msg.text||'').slice(0,100);
  $('#msgInput').focus();
}
function clearComposer(){
  if(composer.mode==='edit'){$('#msgInput').value='';resizeInput();}
  composer={mode:null,msg:null};
  $('#composerBar').classList.add('hidden');
}
$('#cbClose').onclick=clearComposer;

const input=$('#msgInput');
function resizeInput(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';}
input.addEventListener('input',()=>{
  resizeInput();
  const has = !!input.value.trim();
  $('#sendBtn').classList.toggle('hidden',!has);
  $('#micBtn').classList.toggle('hidden',has);
  if(activeId&&Date.now()-lastTypingSent>2500&&input.value){lastTypingSent=Date.now();api('/typing',{method:'POST',body:{chatId:activeId}});}
});
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&!window.matchMedia('(pointer:coarse)').matches){e.preventDefault();sendMessage();}
});
$('#sendBtn').addEventListener('pointerdown',e=>e.preventDefault());
$('#sendBtn').addEventListener('click',sendMessage);

async function sendMessage(){
  const text=input.value.trim();
  if(!text||!activeId) return;
  const mode=composer.mode, target=composer.msg;
  input.value=''; resizeInput();
  $('#sendBtn').classList.add('hidden'); $('#micBtn').classList.remove('hidden');
  if(mode==='edit'){
    composer={mode:null,msg:null}; $('#composerBar').classList.add('hidden');
    if(text===target.text) return;
    const r=await api('/messages/'+target.id,{method:'PUT',body:{text}});
    if(!r.success) toast(r.message||'Failed to edit');
    else{const i=msgs.findIndex(x=>x.id===target.id);if(i>-1){msgs[i]=r.message;renderMessages(false);}loadChats();}
    return;
  }
  const body={chatId:activeId,text};
  if(mode==='reply') body.replyTo=target.id;
  composer={mode:null,msg:null}; $('#composerBar').classList.add('hidden');
  const r=await api('/messages',{method:'POST',body});
  if(!r.success){toast(r.message||'Failed to send');input.value=text;resizeInput();return;}
  if(r.message.chatId===activeId&&!msgs.some(x=>x.id===r.message.id)){msgs.push(r.message);renderMessages(true);}
  loadChats();
}

const MAX_FILE = 600 * 1024 * 1024; // 600 MB
const CHUNK = 4 * 1024 * 1024;      // 4 MB per chunk (safe for base64 + JSON)

$('#attachBtn').onclick = ()=>{

  const menu = document.createElement('div');
  menu.className='attach-menu';

    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f) return;
      if(f.size > MAX_FILE){ toast('File too large (max 600 MB)'); return; }
      try {
        const url = await uploadAsChunks(f, t);
        if(url) await sendMedia(t, url, '', f.name, f.size);
      } catch(e){ toast('Upload failed: '+e.message); }
    };
    inp.click();
  });
};

/* Upload file as base64 chunks to backend */
async function uploadAsChunks(file, kind){
  showUploadBar(file.name);
  const total = Math.ceil(file.size / CHUNK);
  const uploadId = Math.random().toString(36).slice(2);
  for(let i=0;i<total;i++){
    const slice = file.slice(i*CHUNK, Math.min((i+1)*CHUNK, file.size));
    const dataUrl = await blobToDataURL(slice);
    // strip prefix data:...;base64,
    const comma = dataUrl.indexOf(',');
    const b64 = dataUrl.slice(comma+1);
    const res = await api('/upload/chunk',{method:'POST',body:{
      uploadId, index:i, total, kind, mime:file.type||'application/octet-stream',
      fileName: file.name, fileSize: file.size,
      data: b64
    }});
    if(!res.success){ hideUploadBar(); throw new Error(res.message||'chunk failed'); }
    updateUploadBar((i+1)/total);
  }
  const fin = await api('/upload/finish',{method:'POST',body:{uploadId, kind, fileName: file.name, mime: file.type, total}});
  hideUploadBar();
  if(!fin.success) throw new Error(fin.message||'finish failed');
  return fin.url;
}

function showUploadBar(name){
  let el = $('#uploadBar');
  if(!el){
    el = document.createElement('div'); el.id='uploadBar'; el.className='upload-bar';
    el.innerHTML = `<span class="uname"></span><div class="bar"><i></i></div><span class="pct">0%</span>`;
    document.body.appendChild(el);
  }
  el.querySelector('.uname').textContent = name.length>20 ? name.slice(0,17)+'...' : name;
  updateUploadBar(0);
}
function updateUploadBar(p){
  const el = $('#uploadBar'); if(!el) return;
  el.querySelector('.bar>i').style.width = Math.round(p*100)+'%';
  el.querySelector('.pct').textContent = Math.round(p*100)+'%';
}
function hideUploadBar(){ const el = $('#uploadBar'); if(el) el.remove(); }

function blobToDataURL(blob){
  return new Promise(resolve=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>resolve(null);
    fr.readAsDataURL(blob);
  });
}

async function sendMedia(type, mediaUrl, text, fileName, fileSize){
  if(!activeId) return;
  const body={chatId:activeId,text:text||'',type,mediaUrl,fileName:fileName||''};
  const r=await api('/messages',{method:'POST',body});
  if(!r.success) return toast(r.message||'Failed to send');
  msgs.push(r.message); renderMessages(true); loadChats();
}

/* ===== VOICE RECORDING ===== */
let mediaRecorder = null, recChunks = [], recStartTime = 0, recTimerInterval = null;
$('#micBtn').onclick = async ()=>{
  if(mediaRecorder && mediaRecorder.state==='recording') return;
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){ toast('Microphone access denied'); return; }
  recChunks = [];
  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
  mediaRecorder = mime ? new MediaRecorder(stream, {mimeType:mime}) : new MediaRecorder(stream);
  mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recChunks.push(e.data); };
  mediaRecorder.onstop = async ()=>{
    stream.getTracks().forEach(t=>t.stop());
    const blob = new Blob(recChunks, {type: recChunks[0]?.type || 'audio/webm'});
    closeRecOverlay();
    const duration = Math.round((Date.now()-recStartTime)/1000);
    if(duration < 1){ toast('Hold longer to record'); return; }
    const dataUrl = await blobToDataURL(blob);
    if(dataUrl) await sendMedia('audio', dataUrl, '', 'voice.webm', blob.size);
  };
  mediaRecorder.start();
  recStartTime = Date.now();
  openRecOverlay();
};
function openRecOverlay(){
  closeRecOverlay();
  const el = document.createElement('div'); el.className='rec-overlay'; el.id='recOverlay';
  el.innerHTML = `
    <div class="rec-time-big" id="recTimeBig">0:00</div>
    <div class="rec-wave">${Array.from({length:40}).map((_,i)=>`<span style="animation-delay:${(i%10)*0.1}s"></span>`).join('')}</div>
    <div class="rec-btns">
      <button class="rec-del" id="recCancel">${ic('trash',26)}</button>
      <button class="rec-send" id="recSend">${ic('send',26)}</button>
    </div>`;
  document.body.appendChild(el);
  const start = Date.now();
  recTimerInterval = setInterval(()=>{
    const s = Math.floor((Date.now()-start)/1000);
    $('#recTimeBig').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  },200);
  $('#recCancel').onclick = ()=>{
    if(mediaRecorder && mediaRecorder.state==='recording'){ mediaRecorder.ondataavailable=null; mediaRecorder.onstop=null; mediaRecorder.stop(); }
    if(mediaRecorder) mediaRecorder.stream.getTracks().forEach(t=>t.stop());
    closeRecOverlay();
  };
  $('#recSend').onclick = ()=>{
    if(mediaRecorder && mediaRecorder.state==='recording') mediaRecorder.stop();
  };
}
function closeRecOverlay(){
  const el = $('#recOverlay'); if(el) el.remove();
  clearInterval(recTimerInterval);
}

$('#spList').addEventListener('click', e=>{
  const sw = e.target.closest('[data-switch]');
  if(sw){ switchAccount(sw.dataset.switch); return; }
  const it = e.target.closest('[data-a]'); if(!it) return;
  const a = it.dataset.a;
  closeSidePanel();
  if(a==='addAccount') addAccountFlow();
  if(a==='myProfile') openProfileModal(me, true);
  if(a==='saved') openSavedMessages();
  if(a==='contacts') openContactsModal();
  if(a==='notif') openNotificationsSettings();
  if(a==='settings') openSettings();

});

async function switchAccount(userId){
  const acc = accounts.find(a=>a.userId===userId);
  if(!acc) return;
  token = acc.token; localStorage.setItem('ms_token', token);
  closeSidePanel();
  const r = await api('/me');
  if(r.success){ me=r.user; chats=[]; activeId=null; msgs=[]; ver=null;
    await loadChats(); chatsLoaded=true; connectEvents(); renderSidePanel();
    toast('Switched to '+me.firstName);
  } else toast('Could not switch account');
}
function addAccountFlow(){
  if(accounts.length>=5){ toast('Max 5 accounts'); return; }
  $('#app').classList.add('hidden');
  $('#auth').classList.remove('hidden');
  showStep('email');
  $('#email').value=''; $('#password').value=''; $('#firstName').value=''; $('#username').value='';
}

/* ===== PROFILE MODAL (with cross-button fix) ===== */
function openProfileModal(user, isMe){
  const host = $('#modalHost'); host.innerHTML = '';
  const modal = document.createElement('div');
  modal.className='modal';
  const m = chatMeta[user.id]||{};
  const disp = isMe?user:{...user, firstName:m.customName||user.firstName, profilePhoto:m.customPhoto||user.profilePhoto};
  const isBlocked = blockedSet.has(user.id);
  const isMuted = mutedSet.has(user.id);
  const bioRow = user.bio ? `<div class="prow"><span class="label">Bio</span><span class="val">${fmtText(user.bio)}</span></div>` : '';
  modal.innerHTML = `
    <div class="sheet">
      <div class="sheet-head">
        <button class="icon-btn" data-close>${ic('close')}</button>
        <h3>${isMe?'My Profile':'Profile'}</h3>
        ${isMe?`<button class="text-btn" data-edit>Edit</button>`:`<button class="text-btn" data-save-contact>Add contact</button>`}
      </div>
      <div class="sheet-body">
        <div class="profile-hero">
          <div data-avatar>${avatar(disp,'',true)}</div>
          <div class="name">${fmtText(disp.firstName)}</div>
          <div class="uname">@${esc(user.username||'')}</div>
        </div>
        <div class="profile-rows">
          ${isMe?`<div class="prow"><span class="label">Email</span><span class="val">${esc(user.email||'')}</span></div>`:''}
          ${bioRow}
          <div class="prow"><span class="label">Link</span><span class="val"><a href="#" data-mention="${esc(user.username||'')}">ms-chat-messengersss.vercel.app/${esc(user.username||'')}</a></span></div>
        </div>
        ${isMe?'':`
        <div style="padding:12px 0">
          <button class="row-btn" data-block>${ic('block',22)}<span>${isBlocked?'Unblock':'Block user'}</span></button>
          <button class="row-btn" data-mute>${ic(isMuted?'unmute':'mute',22)}<span>${isMuted?'Unmute':'Mute'}</span></button>
          <button class="row-btn" data-editcontact>${ic('edit',22)}<span>Edit contact</span></button>
          <button class="row-btn" data-delcontact style="color:var(--danger)">${ic('trash',22)}<span>Delete contact info</span></button>
        </div>`}
      </div>
    </div>`;
  host.appendChild(modal);
  // FIX: cross + backdrop close working properly
  const closeIt = ()=> host.innerHTML='';
  modal.addEventListener('click', async e=>{
    if(e.target===modal || e.target.closest('[data-close]')){ closeIt(); return; }
    if(e.target.closest('[data-edit]')){ closeIt(); openSettings(); return; }
    if(e.target.closest('[data-save-contact]')){
      const exists = contacts.find(c=>c.userId===user.id);
      if(exists) toast('Already in contacts');
      else{ contacts.push({userId:user.id, firstName:user.firstName, username:user.username, photo:user.profilePhoto}); saveContacts(); toast('Saved'); }
      closeIt(); return;
    }
    if(e.target.closest('[data-block]')){
      const i=blocked.indexOf(user.id);
      if(i>-1) blocked.splice(i,1); else blocked.push(user.id);
      saveBlocked();
      toast(blockedSet.has(user.id)?'Blocked':'Unblocked');
      closeIt(); return;
    }
    if(e.target.closest('[data-mute]')){
      const i=muted.indexOf(user.id);
      if(i>-1) muted.splice(i,1); else muted.push(user.id);
      saveMuted(); toast(mutedSet.has(user.id)?'Muted':'Unmuted'); renderChats();
      closeIt(); return;
    }
    if(e.target.closest('[data-editcontact]')){
      const name = prompt('Custom name for '+user.firstName, (chatMeta[user.id]||{}).customName||user.firstName);
      if(name===null) return;
      const photo = prompt('Custom photo URL (blank = remove)', (chatMeta[user.id]||{}).customPhoto||'');
      chatMeta[user.id] = {customName:name||'', customPhoto:photo||''};
      saveChatMeta(); renderChats(); updateHeader();
      closeIt(); return;
    }
    if(e.target.closest('[data-delcontact]')){
      delete chatMeta[user.id];
      saveChatMeta(); renderChats(); updateHeader(); toast('Contact info removed (chat kept)');
      closeIt(); return;
    }
    if(e.target.closest('[data-avatar]') && isMe){
      closeIt(); openSettings();
      return;
    }
  });
}

        <button class="row-btn danger" id="setLogout">${ic('logout',22)}<span>Log out</span></button>
      </div>
    </div>`;
  host.appendChild(modal);
  const closeIt = ()=> host.innerHTML='';
  const paintAvatar=()=>{
    const photo = pendingPhoto!==null?pendingPhoto:me.profilePhoto;
    $('#setAvatar').innerHTML = avatar({...me, profilePhoto:photo}, 'lg');
  };
  pendingPhoto=null;
  $('#setFirstName').value=me.firstName;
  $('#setUsername').value=me.username;
  $('#setBio').value=me.bio||'';
  $('#setDark').checked = settings.theme==='dark';
  $('#set24').checked = settings.hour24;
  $('#setFont').value = settings.fontSize;
  $('#setNotif').checked = settings.notif;
  $('#setSound').checked = settings.sound;
  $('#setDblReaction').innerHTML = REACTION_EMOJIS.slice(0,12).map(e=>`<option value="${e}" ${e===settings.doubleTapReaction?'selected':''}>${e}</option>`).join('');
  const wps = [
    {v:'', label:'None'},
    {v:'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800'},
    {v:'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800'},
    {v:'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800'},
    {v:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800'},
    {v:'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800'},
  ];
  const wpGrid = $('#wpGrid', modal);
  wpGrid.innerHTML = wps.map(w=>`<div class="wp-item ${settings.wallpaper===w.v?'active':''}" data-w="${esc(w.v)}" style="${w.v?`background-image:url(${w.v})`:''}">${w.label||''}</div>`).join('');
  wpGrid.onclick = e=>{
    const it=e.target.closest('.wp-item'); if(!it) return;
    settings.wallpaper = it.dataset.w;
    saveSettings(); applySettings();
    $$('.wp-item',wpGrid).forEach(x=>x.classList.toggle('active',x===it));
  };
  paintAvatar();
  // Auto-save basic info on close
  const saveBasic = async ()=>{
    const changed = $('#setFirstName').value!==me.firstName || $('#setUsername').value!==me.username || $('#setBio').value!==(me.bio||'') || pendingPhoto!==null;
    if(!changed) return;
    const r=await api('/user/update',{method:'POST',body:{
      firstName:$('#setFirstName').value,
      username:$('#setUsername').value,
      bio:$('#setBio').value,
      profilePhoto: pendingPhoto!==null?pendingPhoto:me.profilePhoto,
    }});
    if(!r.success) return toast(r.message||'Could not save');
    me=r.user; toast('Saved'); loadChats();
  };
  modal.addEventListener('click', async e=>{
    if(e.target===modal || e.target.closest('[data-close]')){ await saveBasic(); closeIt(); return; }
    const a = e.target.closest('[data-a]')?.dataset.a;
    if(a==='changeEmail'){ changeEmailFlow(); return; }
    if(a==='changePassword'){ changePasswordFlow(); return; }
    if(a==='setup2fa'){ setup2FAFlow(); return; }
    if(a==='remove2fa'){ remove2FAFlow(); return; }
    if(a==='wpUpload'){
      const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange = ()=>{
        const f = inp.files[0]; if(!f) return;
        if(f.size > 3*1024*1024){ toast('Wallpaper max 3MB'); return; }
        const fr = new FileReader();
        fr.onload = ()=>{ settings.wallpaper = fr.result; saveSettings(); applySettings(); toast('Wallpaper set'); closeIt(); };
        fr.readAsDataURL(f);
      };
      inp.click(); return;
    }
    if(a==='wpUrl'){
      const url = prompt('Enter wallpaper URL:'); if(!url) return;
      settings.wallpaper = url; saveSettings(); applySettings(); toast('Wallpaper set'); closeIt(); return;
    }
    if(e.target.closest('#setLogout')){ if(confirm('Log out?')) doLogout(); }
  });
  $('#setAvatar').onclick = ()=>{
    const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
    inp.onchange = ()=>{
      const f=inp.files[0]; if(!f) return;
      const img=new Image(),url=URL.createObjectURL(f);
      img.onload=()=>{
        const S=128,cv=document.createElement('canvas'); cv.width=cv.height=S;
        const side=Math.min(img.width,img.height);
        cv.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);
        pendingPhoto=cv.toDataURL('image/jpeg',0.7); paintAvatar(); URL.revokeObjectURL(url);
      };
      img.src=url;
    };
    inp.click();
  };
  $('#setDark').onchange = e=>{ settings.theme=e.target.checked?'dark':'light'; saveSettings(); applySettings(); };
  $('#set24').onchange = e=>{ settings.hour24=e.target.checked; saveSettings(); renderMessages(false); renderChats(); };
  $('#setFont').oninput = e=>{ settings.fontSize=+e.target.value; saveSettings(); applySettings(); };
  $('#setNotif').onchange = async e=>{
    settings.notif=e.target.checked; saveSettings();
    if(settings.notif && window.Notification && Notification.permission==='default'){
      try{ await Notification.requestPermission(); }catch(err){}
    }
  };
  $('#setSound').onchange = e=>{ settings.sound=e.target.checked; saveSettings(); };
  $('#setDblReaction').onchange = e=>{ settings.doubleTapReaction=e.target.value; saveSettings(); };
}
function isPresetWallpaper(v){
  return !v || v.startsWith('https://images.unsplash.com/');
}

    if(e.target.closest('#nTest')){
      if(Notification.permission==='granted'){
        new Notification('MS Chat', {body:'Test notification 🔔', icon:'https://web.telegram.org/a/img-apple-64/1f4ac.png'});
      } else toast('Enable notifications first');
    }
  });
  $('#nNotif').onchange=async e=>{
    settings.notif=e.target.checked; saveSettings();
    if(settings.notif && window.Notification && Notification.permission!=='granted'){
      try{ await Notification.requestPermission(); }catch(err){}
    }
  };
  $('#nSound').onchange=e=>{ settings.sound=e.target.checked; saveSettings(); };
}

/* ===== PWA ===== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall=e; $('#installAuth').classList.remove('hidden'); });
window.addEventListener('appinstalled', ()=>{ deferredInstall=null; $('#installAuth').classList.add('hidden'); toast('App installed'); });
$('#installAuth').onclick = async ()=>{ if(!deferredInstall) return; deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall=null; $('#installAuth').classList.add('hidden'); };
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{})); }

/* Refresh relative times */
setInterval(()=>{ if(me){ updateHeader(); } }, 60000);

/* Direct link support: /username → open chat */
(async function checkDirectLink(){
  if(!token) return;
  const path = location.pathname.replace(/^\//,'').replace(/\/$/,'');
  if(!path || path.includes('.') || path === 'index.html' || path === 'api') return;
  setTimeout(async ()=>{
    if(!me) return;
    const r = await api('/users/search?q='+encodeURIComponent(path));
    if(Array.isArray(r) && r.length){
      const u = r.find(x=>x.username.toLowerCase()===path.toLowerCase()) || r[0];
      const cr = await api('/chats/create',{method:'POST',body:{targetUserId:u.id}});
      if(cr.success){ if(!chats.some(c=>c.id===cr.chat.id)) chats.unshift(cr.chat); renderChats(); openChat(cr.chat.id); }
    }
  }, 800);
})();

boot();
})();
</script>
